<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piotr Hamryszczak — Pjotografia | Fotografia Przyrody i Krajobrazu</title>
    <!-- Czcionki Google Fonts: Cinzel (eleganckie nagłówki) oraz Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --gold: #d4af37;
            --yellow: #f1c40f;
            --orange: #e67e22;
            --white: #ffffff;
            --text-gray: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        /* Górne menu / Nagłówek w stylu profesjonalnego portfolio */
        header {
            background-color: rgba(8, 8, 8, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .logo p {
            font-size: 0.75rem;
            color: var(--orange);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            text-transform: uppercase;
            font-weight: 400;
        }

        nav ul li a:hover {
            color: var(--yellow);
        }

        /* Główny baner powitalny (Hero) */
        .hero {
            text-align: center;
            padding: 90px 20px 60px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--yellow);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1.15rem;
            font-weight: 300;
        }

        /* Siatka galerii (układ portfolio jak u profesjonalistów) */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 30px 60px 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
        }

        .gallery-card {
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }
