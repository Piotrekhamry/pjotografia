<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pjotografia – linki</title>
    <meta name="description" content="Fotografia górska Piotra Hamryszczaka: galerie, sesje dla par, aplikacja Morze chmur i aplikacja treningowa W Formie.">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Pjotografia – linki">
    <meta property="og:description" content="Galerie, sesje dla par i moje aplikacje dla ludzi gór.">
    <meta property="og:image" content="https://res.cloudinary.com/sivhxknj/image/upload/c_fill,w_1200,h_630,f_jpg,q_auto/v1793259284/Babia%20g%C3%B3ra.jpg">
    <meta name="theme-color" content="#14161a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; min-height: 100svh; font-family: 'Roboto', sans-serif; font-weight: 300; color: #fff; background: #14161a; }
        .bg { position: fixed; inset: 0; background: #14161a center/cover no-repeat; z-index: -1; }
        .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,12,16,.55), rgba(10,12,16,.88)); }
        .wrap { max-width: 460px; margin: 0 auto; padding: 48px 20px 36px; text-align: center; }
        .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.85); margin: 0 auto 16px; display: block; }
        h1 { font-weight: 400; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
        .tag { opacity: .8; margin: 4px 0 30px; font-size: .95rem; }
        .group { font-size: .72rem; letter-spacing: 2px; text-transform: uppercase; opacity: .6; margin: 26px 0 10px; }
        .lnk { display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 14px 16px; margin-bottom: 10px; border-radius: 14px; transition: background .25s, transform .25s; }
        .lnk:hover, .lnk:active { background: rgba(255,255,255,.2); transform: translateY(-2px); }
        .lnk .ic { width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; font-size: 1.3rem; background: rgba(255,255,255,.12); overflow: hidden; }
        .lnk .ic img { width: 100%; height: 100%; object-fit: cover; }
        .lnk b { display: block; font-weight: 500; font-size: 1rem; }
        .lnk small { display: block; opacity: .75; font-size: .82rem; line-height: 1.35; margin-top: 2px; }
        .lnk.coffee { background: rgba(255,255,255,.92); color: #222; border-color: #fff; }
        .lnk.coffee .ic { background: rgba(0,0,0,.06); }
        .foot { margin-top: 30px; font-size: .75rem; opacity: .55; }
    </style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="wrap">
    <img class="avatar" id="avatar" alt="Piotr Hamryszczak">
    <h1>Pjotografia</h1>
    <p class="tag">Fotografia górska · Kraków<br>Buduję też aplikacje dla ludzi gór – z pomocą AI</p>

    <div id="links"></div>

    <p class="foot">© <span id="year"></span> Piotr Hamryszczak</p>
</div>

<script src="js/config.js"></script>
<script>
(function () {
    const S = window.SITE;
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const opt = (url, w) => (url ? url.replace(/(\/image\/upload\/)(v\d+\/)/, `$1f_auto,q_auto,w_${w}/$2`) : url);

    document.getElementById('bg').style.backgroundImage = `url('${opt(S.hero, 1400)}')`;
    document.getElementById('avatar').src = opt(S.avatar, 240);
    document.getElementById('year').textContent = new Date().getFullYear();

    const item = (href, icon, title, text, cls, ext) => `
        <a class="lnk ${cls || ''}" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>
            <span class="ic">${icon.includes('.') ? `<img src="${esc(icon)}" alt="">` : icon}</span>
            <span><b>${esc(title)}</b>${text ? `<small>${esc(text)}</small>` : ''}</span>
        </a>`;

    let html = '';
    const apps = (S.apps || []).filter((a) => a.url);
    if (apps.length) {
        html += '<p class="group">Moje aplikacje</p>';
        html += apps.map((a) => item(a.url, a.icon || '📱', a.name, a.text)).join('');
    }
    html += '<p class="group">Fotografia</p>';
    html += item('galerie.html', '🏔️', 'Galerie zdjęć', 'Tatry, Babia Góra, Bieszczady i więcej');
    html += item('sesje-plenerowe.html', '💑', 'Sesje dla par', 'Plener w Krakowie, gminie Czernichów i w górach');
    html += item('cennik.html', '📋', 'Cennik', 'Pakiety od 450 zł');
    html += item('kontakt.html', '✉️', 'Kontakt', '');
    if (S.donate) {
        html += '<p class="group">Wesprzyj</p>';
        html += item(S.donate, '☕', 'Postaw mi kawę', 'Aplikacje są darmowe – jeśli Ci się przydają, będzie mi miło', 'coffee', true);
    }
    document.getElementById('links').innerHTML = html;
})();
</script>
</body>
</html>
