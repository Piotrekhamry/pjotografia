function updateHint(){

}

    facts:['Targi Trajana (ok. 100–110 n.e.) to wielopiętrowy kompleks sklepów i biur – często nazywany pierwszym „centrum handlowym”.','Nad porządkiem na targach i miarami wag czuwali urzędnicy – edylowie.']},
  baths:{era:'pierwsze wielkie termy w Rzymie: Agryppa, ok. 25 p.n.e.',text:'Termy były czymś więcej niż łaźnią: ćwiczono tu w palestrze, rozmawiano, załatwiano interesy. Kąpiel szła po kolei: przebieralnia, ciepłe tepidarium, gorące caldarium i zimne frigidarium.',
    facts:['Podłogi i ściany ogrzewał hypokaust: gorące powietrze z pieca płynęło pod podłogą opartą na słupkach z cegieł.','Wstęp kosztował grosze – często jednego quadransa, najmniejszą monetę. Dzieci wchodziły za darmo.','Wodę doprowadzały akwedukty, a woda zużyta w termach płukała potem kanały.']},
  caracalla:{era:'ok. 212–216 n.e., cesarz Karakalla',text:'Jedne z największych i najwspanialszych term Rzymu. Oprócz basenów i sal kąpielowych miały ogrody, palestry i dwie biblioteki – grecką i łacińską.',
    facts:['Mogły przyjąć jednocześnie ok. 1600 kąpiących się.','Ogromne okrągłe caldarium przykrywała kopuła zbliżona rozmiarem do kopuły Panteonu.','Działały ponad 300 lat – do 537 r., gdy Ostrogoci podczas oblężenia przecięli akwedukty. Dziś latem w ruinach wystawia się opery.']},
  diocletian:{era:'298–306 n.e., cesarz Dioklecjan',text:'Największe termy starożytnego Rzymu – kompleks zajmował ok. 13 hektarów.',
    facts:['Mogły pomieścić nawet ok. 3000 kąpiących się naraz.','W XVI w. Michał Anioł przebudował frigidarium na bazylikę Santa Maria degli Angeli e dei Martiri – działa do dziś.','Półkolista egzedra term wyznacza dziś kształt Piazza della Repubblica w Rzymie.']},
  colosseum:{era:'ok. 70–80 n.e., Wespazjan i Tytus',text:'Amfiteatr Flawiuszów. Budowę zaczął cesarz Wespazjan, a otworzył go jego syn Tytus w 80 n.e. igrzyskami, które trwały 100 dni. Odbywały się tu walki gladiatorów i polowania na dzikie zwierzęta.',
    facts:['Mieścił ok. 50 000 widzów; ma ok. 189 × 156 m i ok. 48 m wysokości.','Przed słońcem chroniło widzów velarium – płócienny dach, który rozpinali marynarze cesarskiej floty.','Pod areną znajdowało się hypogeum: korytarze, klatki i windy, którymi wypuszczano zwierzęta na arenę.']},
  circus:{era:'wg tradycji od VI w. p.n.e.',text:'Circus Maximus – najstarszy i największy tor wyścigów rydwanów w Rzymie, długi na ok. 600 m. Mógł pomieścić ok. 150 000 widzów.',
    facts:['Wyścig trwał 7 okrążeń; licznikiem były drewniane jaja i brązowe delfiny na spinie – delfiny dodał Agryppa w 33 p.n.e.','Kibicowano czterem stronnictwom: Czerwonym, Białym, Zielonym i Niebieskim – w grze rydwany mają te same barwy.','Obelisk na spinie sprowadził z Egiptu August w 10 p.n.e.; dziś stoi na Piazza del Popolo.']},
  theatre:{era:'pierwszy kamienny teatr: Pompejusz, 55 p.n.e.',text:'Wcześniej teatry w Rzymie stawiano z drewna i rozbierano po przedstawieniach. Pierwszy stały, kamienny teatr zbudował Pompejusz – na szczycie widowni umieścił świątynię Wenus.',
    facts:['Półkolistą widownię nazywano cavea, a ozdobną, wielokondygnacyjną ścianę za sceną – scaenae frons.','Teatr Marcellusa, ukończony za Augusta, stoi do dziś – w średniowieczu przerobiono go na twierdzę, a później na pałac.']},
  barracks:{era:'castra – od czasów republiki',text:'Legion w marszu co wieczór budował obóz według tego samego planu: prostokąt z wałem i rowem oraz dwiema głównymi drogami, via principalis i via praetoria. W środku stała komendantura – principia.',
    facts:['Ośmiu żołnierzy dzieliło namiot i muła – to contubernium. Dziesięć contubernia tworzyło centurię (80 ludzi).','Wiele miast wyrosło z obozów legionowych, np. Wiedeń (Vindobona) czy York (Eboracum).','Gwardia pretoriańska miała w Rzymie własny obóz – Castra Praetoria (ok. 23 n.e.).']},
  domus:{era:'od czasów republiki',text:'Dom zamożnej rodziny, zwrócony do wnętrza. Przez otwór w dachu (compluvium) deszczówka spływała do basenu (impluvium) w atrium, a z tyłu domu był perystyl – ogród otoczony kolumnadą.',
    facts:['Od strony ulicy domus często miał tylko drzwi i małe okna, a pomieszczenia od frontu wynajmowano jako sklepy.','W Pompejach przy wejściu do jednego z domów zachowała się mozaika z psem i napisem CAVE CANEM – „uważaj na psa”.']},
  insula:{era:'od III w. p.n.e.',text:'Czynszowa kamienica, w której mieszkała większość Rzymian. Na parterze były sklepy, wyżej mieszkania – im wyżej, tym ciaśniejsze i tańsze, bez wody i bardziej zagrożone pożarem.',
    facts:['August ograniczył wysokość budynków do ok. 70 stóp (ok. 21 m).','Spisy z IV w. podają, że w Rzymie było ok. 46 000 insul i tylko ok. 1800 domów jednorodzinnych.']},
  taberna:{era:'cały okres rzymski',text:'Mały sklep albo warsztat na parterze, otwarty szeroko na ulicę i zamykany na noc drewnianymi okiennicami.',
    facts:['Thermopolium było barem z gorącym jedzeniem: w murowaną ladę wpuszczano gliniane naczynia (dolia) z potrawami.','W Pompejach zachowało się ponad sto takich barów.']},
  house:{era:'',text:'Zwykłe kamienice i domy tworzące większość zabudowy rzymskiego miasta – tynkowane, kryte czerwoną dachówką.',facts:['Rzymianie wymyślili dachówki, które zakładały się na siebie: płaskie tegulae i półokrągłe imbrices.']},
  garden:{era:'',text:'Ogrody perystylowe były zieloną duszą domów: z fontannami, rzeźbami, ziołami i drzewami owocowymi.',facts:['W Pompejach archeolodzy odlali w gipsie ślady korzeni roślin i odtworzyli, co rosło w ogrodach sprzed 79 n.e.']},
  arch:{era:'Łuk Tytusa ok. 81 n.e., Łuk Konstantyna 315 n.e.',text:'Łuki triumfalne wznoszono na pamiątkę zwycięstw. Przez łuk przejeżdżał pochód triumfalny wodza.',
    facts:['Łuk Tytusa upamiętnia zdobycie Jerozolimy w 70 n.e. – na reliefie niesiona jest menora ze Świątyni Jerozolimskiej.','Łuk Konstantyna to największy zachowany łuk w Rzymie; część jego reliefów zabrano ze starszych pomników.','Wg przekazów za triumfatorem stał niewolnik, który przypominał mu, że jest tylko człowiekiem.']},
  fountain:{era:'',text:'Większość mieszkańców nie miała wody w domu – brali ją z publicznych fontann i basenów zasilanych przez akwedukty.',facts:['Według Pliniusza Agryppa zbudował w Rzymie ok. 700 basenów i 500 fontann.','Woda w fontannach płynęła bez przerwy – nadmiar spływał do kanałów.']},
  statue:{era:'',text:'Fora i ulice wypełniały posągi bogów, cesarzy i zasłużonych obywateli – z marmuru i brązu, często malowane na żywe kolory.',facts:['Brązowy posąg konny Marka Aureliusza (ok. 175 n.e.) przetrwał, bo przez wieki mylono go z Konstantynem, pierwszym chrześcijańskim cesarzem.']},
  column:{era:'Kolumna Trajana, 113 n.e.',text:'Kolumny honorowe upamiętniały cesarzy i ich zwycięstwa. Najsłynniejsza, Kolumna Trajana, ma trzon wysoki na 100 rzymskich stóp (ok. 30 m).',
    facts:['Spiralny fryz długości ok. 190 m opowiada jak komiks o wojnach Trajana z Dakami.','W środku są kręte schody na szczyt, a w cokole złożono urnę z prochami cesarza. Od 1587 r. na szczycie stoi posąg św. Piotra.']},
  cypress:{era:'',text:'Smukłe cyprysy były w starożytności drzewami związanymi z pamięcią o zmarłych – sadzono je przy grobowcach.',facts:['Rzymianie chowali zmarłych poza murami miasta, dlatego drogi wylotowe, jak Via Appia, obstawione były grobowcami.']},
  pine:{era:'',text:'Pinia o parasolowatej koronie to symbol krajobrazu wokół Rzymu.',facts:['Jej nasiona – orzeszki piniowe – jedzono już w starożytności.']},
  'r-narrow':{era:'',text:'Wąskie uliczki (vici) były brukowane, z wyższymi chodnikami po bokach.',facts:['W Pompejach na ulicach leżą duże kamienie, po których przechodziło się suchą nogą, a wozy przejeżdżały między nimi.']},
  'r-wide':{era:'Via Appia: 312 p.n.e.',text:'Rzymskie drogi budowano warstwami: podsypka z kamieni, żwir, ubita warstwa z zaprawą, a na wierzchu płyty bazaltu. Via Appia, „królowa dróg”, prowadziła z Rzymu na południe Italii.',
    facts:['Prawo Juliusza Cezara zakazało wozom wjazdu do Rzymu w ciągu dnia (poza wyjątkami) – nocą miasto huczało od kół.','W szczytowym okresie sieć rzymskich dróg liczyła dziesiątki tysięcy kilometrów.']},
  'l-aq':{era:'Aqua Appia: 312 p.n.e.',text:'Akwedukty doprowadzały wodę z gór do miasta wyłącznie siłą grawitacji. Większość ich długości biegła pod ziemią – na arkadach tylko przez doliny i niziny.',
    facts:['W czasach największego rozkwitu Rzym zasilało 11 akweduktów.','Spadek kanału bywał bardzo mały – często poniżej metra na kilometr.','Aqua Virgo z 19 p.n.e. do dziś zasila Fontannę di Trevi.']},
  'l-wall':{era:'Mur Serwiański IV w. p.n.e., Mur Aureliana 271–275 n.e.',text:'Pierwszy wielki mur Rzymu wzniesiono po złupieniu miasta przez Galów (ok. 390 p.n.e.). Przez stulecia pokoju miasto rozrosło się daleko poza niego.',
    facts:['Mur Aureliana miał ok. 19 km długości i 383 wieże – w dużej części stoi do dziś.','Bramy stały tam, gdzie mur przecinały drogi – w grze mur na drodze sam zamienia się w bramę.']},
};

INFO.castra={name:'Obóz legionowy (castra)',era:'od czasów republiki; stałe twierdze od I w. n.e.',text:'Obóz otaczał rów, wał ziemny i palisada z zaostrzonych bali – z czasem stałe twierdze dostawały mury z kamienia. Stała twierdza legionu – ok. 5000 żołnierzy na ok. 20 hektarach. Plan w kształcie karty do gry: zaokrąglone narożniki, cztery bramy, dwie główne ulice (via principalis i via praetoria), pośrodku principia ze sztandarami, obok dom dowódcy, spichlerze, szpital, warsztaty i rzędy baraków.',
  facts:['Z obozów legionowych wyrosło wiele miast: Wiedeń (Vindobona), York (Eboracum), Chester (Deva), Bonn, Moguncja, Strasburg czy Ratyzbona (Castra Regina).','Londyn i Paryż zaczynały inaczej – Londinium jako osada handlowa nad Tamizą, a Lutecja jako gród galijskiego plemienia Parysjów.','Najważniejszym miejscem obozu była kaplica w principiach, gdzie przechowywano orła legionu i kasę żołdu.'],
  today:'W wielu miastach ślady obozu widać w układzie ulic starego miasta, np. w Chester czy Ratyzbonie.',legacy:'Prostokątna siatka ulic obozu to jeden z wzorów dla planów miast aż do dziś.'};
INFO.castellum={name:'Placówka (castellum)',era:'I–IV w. n.e.',text:'Mały fort na granicy imperium dla oddziału posiłkowego – od kilkudziesięciu do ok. 500 żołnierzy. Strzegł dróg, brodów i przejść przez limes.',
  facts:['Między fortami stały wieże strażnicze, a całość łączyły drogi i system sygnałów.','Z niektórych placówek też wyrosły miasta – np. Koblencja (Confluentes).'],
  today:'Fort Saalburg w Niemczech zrekonstruowano na początku XX w. – można go zwiedzać.'};
INFO.port={name:'Port rzymski',era:'Ostia od IV w. p.n.e., Portus: Klaudiusz 42–64 n.e., Trajan ok. 112 n.e.',text:'Ostia u ujścia Tybru była portem Rzymu. Klaudiusz zbudował obok nowy port – Portus, a Trajan dodał sześciokątny basen o boku ok. 358 m. Zboże z Egiptu i Afryki, oliwa z Hiszpanii i wino trafiały do magazynów (horrea) i barkami w górę Tybru.',
  facts:['Latarnię Portusu postawiono na zatopionym statku, którym wcześniej przywieziono z Egiptu obelisk stojący dziś przed Bazyliką św. Piotra.','Na placu Korporacji w Ostii mozaiki przed biurami kupców pokazują statki, ryby i nazwy miast, z którymi handlowali.','Do załadunku używano dźwigów z kołem deptakowym – ludzie chodzili w środku koła jak chomik.'],
  today:'Ruiny Ostii to jedno z najlepiej zachowanych miast rzymskich, a sześciokątny basen Trajana jest dziś jeziorem tuż obok lotniska Fiumicino.',legacy:'Falochrony z betonu wylewanego pod wodą (z popiołem wulkanicznym) to rzymski wynalazek – opisał je Witruwiusz.'};
INFO.emporium={name:'Emporium – port rzeczny Rzymu',era:'od II w. p.n.e.',surv:0.05,text:'U stóp Awentynu wyładowywano towary przypływające barkami z Ostii: zboże, oliwę i wino. Obok stał ogromny magazyn Porticus Aemilia.',
  facts:['Za magazynami wyrosło wzgórze Monte Testaccio – usypane z potłuczonych amfor po oliwie, według szacunków ok. 50 milionów sztuk.'],today:'Monte Testaccio stoi do dziś w dzielnicy Testaccio.'};
INFO.colosseum.facts=[...INFO.colosseum.facts,'W arkadach drugiego i trzeciego piętra stały posągi – widać je na monetach z czasów Tytusa.','Miejsca przydzielano według stanu: senatorowie siedzieli na marmurowym podium, wyżej ekwici i obywatele, a kobiety na samej górze. Cesarz oglądał igrzyska z loży – pulvinar.','Gladiatorzy walczyli w parach różnych typów, np. murmillo z mieczem i dużą tarczą przeciw retiariusowi z siecią i trójzębem. Nad walką czuwał sędzia – summa rudis.'];
Object.assign(INFO,{
  gardenS:{name:'Ogródek',era:'',text:'Nawet w ciasnym mieście Rzymianie hodowali rośliny – w donicach, skrzynkach i maleńkich ogródkach na tyłach domów.',facts:['Pliniusz Starszy pisał, że zwykli mieszkańcy Rzymu urządzali sobie ogródki nawet w oknach.']},
  topiary:{name:'Ogród topiarowy',era:'od I w. p.n.e.',text:'Rzymscy ogrodnicy – topiarii – przycinali krzewy w kule, stożki, a nawet kształty zwierząt.',facts:['Pliniusz Młodszy opisywał w liście ogród swojej willi z bukszpanem przyciętym w kształty zwierząt i litery układające jego imię.']},
  vineyard:{name:'Winnica',era:'',text:'Wino piło się w Rzymie codziennie, zwykle rozcieńczone wodą. Winorośl rosła nawet wewnątrz murów miast.',facts:['W Pompejach obok amfiteatru odkryto winnicę i obsadzono ją ponownie – znów robi się tam wino.']},
  peristyle:{name:'Ogród perystylowy',era:'od II w. p.n.e.',text:'Serce zamożnego domu: ogród otoczony kolumnadą (perystylem), z fontanną, rzeźbami i równo przyciętymi żywopłotami.',facts:['Ściany kolumnad często malowano w ogrody – z ptakami i drzewami – żeby ogród wydawał się większy.']},
  terrace:{name:'Ogród tarasowy',era:'od I w. p.n.e.',text:'Na zboczach wzgórz urządzano ogrody na kilku poziomach, podpartych murami oporowymi, ze schodami, pergolami i fontannami.',facts:['Ogrody Lukullusa na wzgórzu Pincio schodziły tarasami w dół zbocza – w tym miejscu do dziś rosną ogrody.']},
  park:{name:'Park (horti)',era:'od I w. p.n.e.',text:'Najbogatsi Rzymianie zakładali na obrzeżach miasta wielkie ogrody – horti – z alejami, stawami, pawilonami i kolekcjami rzeźb. Z czasem wiele z nich przeszło na własność cesarzy.',facts:['W Ogrodach Salustiusza znaleziono wiele słynnych rzeźb, m.in. grupę Gala zabijającego żonę i siebie.']},
});
INFO['l-moat']={name:'Fosa (fossa)',era:'od czasów republiki – w każdym obozie i przy murach miast',text:'Rów przed murem był pierwszą linią obrony: spowalniał szturm, utrudniał podsunięcie wież oblężniczych i taranów, a ziemia z wykopu szła na wał za murem. Legioniści kopali fosę wokół każdego obozu, nawet na jedną noc marszu.',
  facts:['Najczęstsza była fossa fastigata – rów w kształcie litery V, z którego trudno się wydostać. Fossa punica miała stromą ścianę od strony obrońców i łagodną od strony wroga.','Przy Murze Serwiańskim w Rzymie przed wałem (agger) biegła fosa szeroka na kilkadziesiąt metrów.','Na dnie lub przed rowem bywały pułapki: zaostrzone pale i zamaskowane doły zwane „liliami” – opisuje je Cezar przy oblężeniu Alezji.','W grze fosa jest wypełniona wodą – w praktyce rzymskie rowy były często suche.'],
  today:'Rowy obozów rzymskich widać do dziś w krajobrazie Brytanii, np. przy Murze Hadriana, gdzie za murem biegnie wielki rów zwany vallum.',
  legacy:'Fosy wokół średniowiecznych zamków i nowożytnych twierdz – także polskich – to dalsza historia tego samego pomysłu.'};
INFO.barbican={name:'Barbakan z kratą',era:'bramy z basztami i kratą: od III w. p.n.e.; słowo „barbakan” – średniowiecze',text:'Rzymianie nie używali słowa barbakan, ale budowali coś podobnego: bramy flankowane dwiema basztami, czasem z wewnętrznym dziedzińcem, w którym wróg, który sforsował pierwsze wrota, trafiał w pułapkę pod ostrzałem z góry. Przejazd zamykała krata (cataracta) opuszczana pionowo w kamiennych prowadnicach.',
  facts:['Liwiusz opisuje kratę spuszczoną w bramie Salapii, która odcięła wdzierających się żołnierzy Hannibala.','Za cesarza Honoriusza (ok. 401–403 n.e.) bramy Muru Aureliana przebudowano: dostały wyższe baszty, dziedzińce bramne i galerie dla obrońców.','Krata spadała pod własnym ciężarem w ułamku sekundy – podnoszenie jej kołowrotem zajmowało dużo dłużej.','W grze: stuknij barbakan, by podnieść lub opuścić kratę. Nocą krata sama opada, a przechodnie czekają do rana.'],
  today:'W Porta San Sebastiano (dawnej Porta Appia) w Rzymie widać jeszcze prowadnice kraty, a w środku działa Muzeum Murów, z którego można wyjść na chodnik obronny Muru Aureliana.',
  legacy:'Krakowski Barbakan z XV w. to średniowieczny potomek tej idei – osobne przedpole przed Bramą Floriańską.'};
INFO['l-wall'].facts.push('Za Honoriusza Mur Aureliana podwyższono niemal dwukrotnie, a w jego grubości poprowadzono krytą galerię dla obrońców.','Ściany murów często lekko się zwężały ku górze – szersza podstawa była stabilniejsza i trudniej było ją podkopać.','W grze mur sam układa się w rytm: wieże co sześć pól, schody od strony miasta, zadaszenia dla straży i pochodnie, które płoną nocą.');
INFO.drawbridge={name:'Most zwodzony',era:'średniowiecze, XII–XV w.',text:'Most zwodzony to wynalazek średniowiecznych zamków – w grze to mały anachronizm. Rzymianie bronili bram inaczej: przed murami kopali fosę (fossa), przez którą prowadził stały most, a bramę zamykała opuszczana pionowo krata.',
  facts:['Stuknij bramę albo most w trybie ✋ rozglądania, aby go podnieść lub opuścić. Gdy most jest w górze, nikt nie wejdzie do miasta.','O zmroku (suwak pory dnia w menu) mosty podnoszą się same.','Opuszczaną kratę w bramie Rzymianie nazywali cataracta – wspomina o niej już Liwiusz.'],
  today:'Mosty zwodzone przetrwały w wielu średniowiecznych zamkach Europy – niektóre wciąż się podnoszą.'};
INFO.watchtower={name:'Wieża strażnicza',era:'na granicach imperium – od I w. n.e.',text:'Wzdłuż granic (limes) stały setki wież strażniczych. Załoga obserwowała okolicę i w razie zagrożenia dawała znak ogniem, dymem albo pochodnią – sygnał biegł od wieży do wieży aż do najbliższego fortu.',
  facts:['Na Kolumnie Trajana widać drewniane wieże z pochodniami i stosami drewna nad Dunajem.','Na Wale Hadriana (od 122 n.e.) co rzymską milę stał fort, a między nimi po dwie wieżyczki.','Wzdłuż limesu w Germanii i Recji stało ok. 900 wież strażniczych.'],
  today:'Na dawnym limesie zachowały się fundamenty wielu wież; kilka zrekonstruowano, a odcinek limesu jest na liście UNESCO.'};
let infoAuto=true, infoKey=null;
const infoEl=document.getElementById('info');
function infoKeyFor(t){ if(!t) return null; if(t.type&&INFO[t.type]) return t.type; if(INFO[t.id]) return t.id; return null; }
function showInfo(key){
  const d=INFO[key]; if(!d){ hideInfo(); return; }
  infoKey=key;
  const name=d.name||DEFS[key]?.name||TOOLS.find(t=>t.id===key)?.name||'';

/* ---- zapisane miasta ---- */
const SLOTS_KEY='urbs-slots', CUR_KEY='urbs-current';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function getSlots(){ try{ return JSON.parse(lsGet(SLOTS_KEY)||'[]'); }catch(e){ return []; } }
function setSlots(a){ lsSet(SLOTS_KEY,JSON.stringify(a)); }
let curSlot=null;
const newSlotId=()=>Date.now().toString(36)+Math.floor(rnd()*1e5).toString(36);
function saveCurrent(explicit){
  if(!curSlot) return;
  if(!lsSet('urbs-slot-'+curSlot.id,serialize())){ if(explicit) toast('Brak miejsca w pamięci przeglądarki'); return; }
  const sl=getSlots(); let m=sl.find(x=>x.id===curSlot.id); if(!m){ m={id:curSlot.id}; sl.unshift(m); }
  m.name=curSlot.name; m.date=Date.now(); m.n=buildings.size; m.size=N; setSlots(sl); lsSet(CUR_KEY,curSlot.id); dirtySave=false;
  if(explicit){ toast('Zapisano „'+curSlot.name+'”'); sfx('pop'); }
}
function loadSlot(id){
  const d=lsGet('urbs-slot-'+id); if(!d){ toast('Nie znaleziono zapisu'); return false; }
  saveCurrent(false); if(todayMode) setToday(false);
  try{ deserialize(d); }catch(e){ toast('Ten zapis jest uszkodzony'); return false; }
  const m=getSlots().find(x=>x.id===id); curSlot={id,name:m?.name||'Miasto'}; lsSet(CUR_KEY,id);
  undoStack.length=0; dirtySave=false; hideInfo(); return true;
}
function deleteSlot(id){ setSlots(getSlots().filter(x=>x.id!==id)); lsDel('urbs-slot-'+id); }
function uniqueName(base){ const names=new Set(getSlots().map(s=>s.name)); if(!names.has(base)) return base; let k=2; while(names.has(base+' '+k)) k++; return base+' '+k; }
function newGame(kind,opt={}){
  saveCurrent(false); if(todayMode) setToday(false); hideInfo();
  let name='Nowe miasto'; biome='italia'; applyBiome();
  if(kind==='region'){ const keys=Object.keys(BIOMES), key=opt.region==='any'||!BIOMES[opt.region]?keys[Math.floor(Math.random()*keys.length)]:opt.region; biome=key; resizeWorld(opt.n||64); genRegion(key,Math.floor(Math.random()*1e9)); name=BIOMES[key].n; setTimeout(()=>showInfo('reg_'+key),400); }
  else if(kind==='rome'){ romeTrajan(); name='Rzym · 117 n.e.'; }
  else if(kind==='rebuild'){ startRebuildGame(); name='Odbudowa Rzymu'; setTimeout(()=>showInfo('rebuildIntro'),500); }
  else if(kind==='pompeii'){ pompeii(); name='Pompeje'; }
  else if(kind==='vindobona'){ vindobona(); name='Vindobona'; }
  else if(kind==='londinium'){ londinium(); name='Londinium'; }
  else if(kind==='castrum'){ defaultWorld(); name='Castrum'; }
  else { resizeWorld(opt.n||48); if(opt.land) landscape(Math.floor(rnd()*1000)); }
  curSlot={id:newSlotId(),name:uniqueName(name)}; undoStack.length=0; saveCurrent(false);
  updateEraLabel(); if(kind==='rome') setTimeout(()=>{ showInfo('rome'); toggleTimeline(true); },400);
  toast('Nowa gra: '+curSlot.name);
}
function migrateSaves(){
  if(getSlots().length) return;
  const sl=[];
  for(const [key,name] of [['urbs-save-v2','Moje miasto'],['urbs-save-v1','Poprzednie miasto']]){
    const d=lsGet(key); if(!d) continue; const id=newSlotId()+sl.length;
    let n=0, size=48; try{ const o=JSON.parse(d); n=o.b.length; size=o.N; }catch(e){ continue; }
    if(lsSet('urbs-slot-'+id,d)) sl.push({id,name,date:Date.now(),n,size});
  }
  if(sl.length){ setSlots(sl); lsSet(CUR_KEY,sl[0].id); }
}
const fmtDate=t=>{ try{ return new Date(t).toLocaleString('pl-PL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
const plBud=n=>n===1?'budynek':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'budynki':'budynków';

/* ---- powiększenie mapy z zachowaniem miasta ---- */
function expandMap(newN){
  if(newN<=N) return; if(todayMode) setToday(false);
  const snap=serialize(), o=JSON.parse(snap), n0=o.N, off=Math.floor((newN-n0)/2);
  const t0=unrle(o.t,n0*n0), r0=unrle(o.r,n0*n0), l0=unrle(o.l,n0*n0);
  const t1=new Uint8Array(newN*newN), r1=new Uint8Array(newN*newN), l1=new Uint8Array(newN*newN), h0=o.h?unrle(o.h,n0*n0):null, h1=new Uint8Array(newN*newN), s0=o.sh?unrle(o.sh,n0*n0):null, s1=new Uint8Array(newN*newN);
  for(let j=0;j<n0;j++) for(let i=0;i<n0;i++){ const a=j*n0+i, b=(j+off)*newN+i+off; t1[b]=t0[a]; r1[b]=r0[a]; l1[b]=l0[a]; if(h0) h1[b]=h0[a]; if(s0) s1[b]=s0[a]; }
  const old=(i,j)=>i>=off&&j>=off&&i<off+n0&&j<off+n0;
  // przedłuż rzeki, drogi i akwedukty z dawnej krawędzi do nowej
  const ext=(i0,j0,di,dj)=>{ const a=(j0)*newN+i0; const t=t1[a], r=r1[a], l=l1[a]; if(t!==2&&!r&&l!==2) return;
    let i=i0+di, j=j0+dj; while(i>=0&&j>=0&&i<newN&&j<newN&&!old(i,j)){ const b=j*newN+i; if(t===2) t1[b]=2; if(r) r1[b]=r; if(l===2) l1[b]=2; i+=di; j+=dj; } };
  for(let k=0;k<n0;k++){ ext(off+k,off,0,-1); ext(off+k,off+n0-1,0,1); ext(off,off+k,-1,0); ext(off+n0-1,off+k,1,0); }
  // nowy krajobraz na dobudowanym pasie
  const sd=Math.floor(rnd()*1000);
  for(let j=0;j<newN;j++) for(let i=0;i<newN;i++){ if(old(i,j)) continue; const b=j*newN+i; if(t1[b]===2||r1[b]||l1[b]) continue;
    const n=vnoise(i/6.5,j/6.5,sd); if(n>0.64) t1[b]=3; else if(vnoise(i/5,j/5,sd+3)>0.72) t1[b]=4; }
  o.N=newN; o.t=rle(t1); o.r=rle(r1); o.l=rle(l1); if(h0) o.h=rle(h1); if(s0) o.sh=rle(s1);
  o.b=o.b.map(a=>{ const c=[...a]; c[1]+=off; c[2]+=off; return c; });
  if(o.rb) o.rb=o.rb.map(a=>{ const c=[...a]; c[1]+=off; c[2]+=off; return c; });
  deserialize(JSON.stringify(o)); pushUndo(snap); saveCurrent(false);
  toast(`Mapa powiększona do ${newN}×${newN} 🗺️`); sfx('done');
}

function swatch(kind,val){
  const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d');
  const fill=(col)=>{ g.fillStyle=col; g.fillRect(0,0,96,96); };
  if(kind==='terrain'){

  const P=(type,x,z,rot,lm)=>{ for(let r=0;r<=4;r++) for(let dz=-r;dz<=r;dz++) for(let dx=-r;dx<=r;dx++){ if(Math.max(Math.abs(dx),Math.abs(dz))!==r) continue; if(canPlace(type,x+dx,z+dz,rot)){ return addBuilding(type,x+dx,z+dz,rot,Math.floor(rnd()*1e6),false,lm); } } console.warn('nie zmieszczono',lm||type); return 0; };

  if(eruption){ eruption.t+=dt; const u=clamp(eruption.t/25,0,1); plume.visible=true; plume.scale.set(1,Math.max(0.001,u),1);
    plume.children.forEach((s,k)=>{ const sz=s.userData.sz*(0.6+0.4*u)*(1+0.06*Math.sin(time*0.8+k)); s.scale.setScalar(sz); s.position.x=s.userData.base.x+Math.sin(time*0.3+k)*0.4; });
    const af=clamp((eruption.t-6)/20,0,1); ash.material.opacity=af*0.8; ash.visible=af>0.01;
    if(ash.visible){ const cx=controls.target.x, cz=controls.target.z;
      for(let k=0;k<ASH_N;k++){ const s=ashSeed[k]; const y=((s[2]*14-time*1.2*(0.6+s[0]*0.5))%14+14)%14; ashPos[k*3]=cx+(s[0]-0.5)*44; ashPos[k*3+1]=y; ashPos[k*3+2]=cz+(s[1]-0.5)*44; }
      ashGeo.attributes.position.needsUpdate=true; }
    ENV.ashF=af; } else { ash.visible=false; ENV.ashF=0; plume.visible=false; }
}

/* =========================================================
   Tryb „Odbuduj Rzym”: obrysy dawnych budowli do odtworzenia
   ========================================================= */
let rebuild=null; const rbMarkers=[];
const blueMat=new THREE.MeshBasicMaterial({color:'#9fd0ff',transparent:true,opacity:0.22,depthWrite:false});
const blueLine=new THREE.LineBasicMaterial({color:'#3f8fe0',transparent:true,opacity:0.55});
const edgeCache=new Map();
function clearRebuildMarkers(){ for(const m of rbMarkers){ scene.remove(m.grp); m.label?.remove(); } rbMarkers.length=0; }
function buildRebuildMarkers(){
  clearRebuildMarkers(); if(!rebuild) return;
  for(const t of rebuild.targets){ if(t.done) continue; const def=DEFS[t.type]; const [fw,fd]=fpSize(def,t.rot); const g=getGeom(t.type,1);
    const grp=new THREE.Group(); grp.position.set(t.x+fw/2-N/2,cellH(t.x,t.z),t.z+fd/2-N/2); grp.rotation.y=t.rot*Math.PI/2;
    const gh=new THREE.Mesh(g,blueMat); gh.renderOrder=3; grp.add(gh);
    if(!edgeCache.has(t.type)) edgeCache.set(t.type,new THREE.EdgesGeometry(g,32)); grp.add(new THREE.LineSegments(edgeCache.get(t.type),blueLine));
    const surv=INFO[t.lm]?.surv??0.1; if(surv>0.01){ const ru=new THREE.Mesh(g,ruinMat); ru.scale.y=Math.max(0.04,surv*0.85); ru.castShadow=true; grp.add(ru); }
    scene.add(grp);
    const el=document.createElement('button'); el.className='lbl target'; el.textContent='🔨 '+shortName(INFO[t.lm]?.name||def.name);
    el.onclick=()=>rebuildPick(t); labelsEl.appendChild(el);
    rbMarkers.push({t,grp,label:el}); }
  updateRbChip();
}
function updateRbChip(){ const c=document.getElementById('rbChip'); if(!rebuild){ c.classList.add('hide'); return; }
  const done=rebuild.targets.filter(t=>t.done).length; c.textContent=`🔨 ${done}/${rebuild.targets.length}`; c.classList.remove('hide'); }
function rebuildPick(t){
  const toolId='b-'+t.type; if(!TOOLS.find(x=>x.id===toolId)) return;
  curCat=DEFS[t.type].cat; itemsOpen=true; if(tool.id!==toolId) selectTool(toolId);
  const [fw,fd]=fpSize(DEFS[t.type],t.rot); const c={i:t.x+Math.floor((fw-1)/2),j:t.z+Math.floor((fd-1)/2)};
  pending={kind:'build',c}; buildRot=t.rot; updatePreview(c); showAct();
  flyTo(wx(c.i),wx(c.j),Math.max(14,Math.max(fw,fd)*2.6));
  showInfo(t.lm); sfx('tick');
}
function snapTarget(type,f){
  if(!rebuild) return null; let best=null, bd=5;
  for(const t of rebuild.targets){ if(t.done||t.type!==type) continue; const [fw,fd]=fpSize(DEFS[type],t.rot);
    const d=Math.hypot((t.x+fw/2)-(f.x+f.fw/2),(t.z+fd/2)-(f.z+f.fd/2)); if(d<bd){ bd=d; best=t; } }
  return best;
}
function placementFor(type,c){
  let rot=autoRotFor(type,c,buildRot); let f=footprint(c,type,rot); const tg=snapTarget(type,f);
  if(tg){ rot=tg.rot; const [fw,fd]=fpSize(DEFS[type],rot); f={x:tg.x,z:tg.z,fw,fd}; }
  return {rot,f,tg};
}
function rebuildDone(tg,id){
  tg.done=true; const b=buildings.get(id); if(b){ b.lm=tg.lm; labelsDirty=true; }
  const mk=rbMarkers.find(m=>m.t===tg); if(mk){ scene.remove(mk.grp); mk.label.remove(); rbMarkers.splice(rbMarkers.indexOf(mk),1); }
  updateRbChip(); dirtySave=true;
  const done=rebuild.targets.filter(t=>t.done).length, all=rebuild.targets.length;
  setTimeout(()=>{ showInfo(tg.lm); toast(`Odbudowano: ${shortName(INFO[tg.lm]?.name||DEFS[tg.type].name)} (${done}/${all})`); },400);
  if(done===all){ setTimeout(()=>{ markEvent('rebuild'); petalsBurst(); toast('Rzym odbudowany! Ave! 🏛️'); startTriumph(true); },2600); }
}
function startRebuildGame(){
  romeTrajan(); romeYear=null; const targets=[];
  for(const b of [...buildings.values()]) if(b.lm&&INFO[b.lm]){ targets.push({type:b.type,x:b.x,z:b.z,rot:b.rot,lm:b.lm,done:false}); removeBuilding(b.id); }
  rebuild={targets}; buildRebuildMarkers();
}

const builds=[];
const scafCache=new Map();
function scaffoldGeom(w,d,H,crane){
  const key=w+'x'+d+'x'+Math.round(H*10)+(crane?'c':''); if(scafCache.has(key)) return scafCache.get(key);
  const b=new B(), P='#9a6b43', PL='#b8874f', hw=w/2+0.06, hd=d/2+0.06;
  const xs=[], zs=[]; for(let x=-hw;x<=hw+0.01;x+=Math.max(0.5,w/Math.ceil(w))) xs.push(x); for(let z=-hd;z<=hd+0.01;z+=Math.max(0.5,d/Math.ceil(d))) zs.push(z);
  for(const x of xs){ b.box(0.035,H,0.035,x,0,-hd,P); b.box(0.035,H,0.035,x,0,hd,P); }
  for(const z of zs){ b.box(0.035,H,0.035,-hw,0,z,P); b.box(0.035,H,0.035,hw,0,z,P); }
  for(let y=0.42;y<H;y+=0.42){ b.box(2*hw,0.03,0.1,0,y,-hd-0.03,PL); b.box(2*hw,0.03,0.1,0,y,hd+0.03,PL); b.box(0.1,0.03,2*hd,-hw-0.03,y,0,PL); b.box(0.1,0.03,2*hd,hw+0.03,y,0,PL);
    b.box(2*hw,0.02,0.02,0,y+0.18,-hd-0.07,P); b.box(2*hw,0.02,0.02,0,y+0.18,hd+0.07,P); }
  for(let y=0.1;y<H;y+=0.12) b.box(0.18,0.015,0.02,hw*0.6,y,hd+0.1,P);
  if(crane){ const cx=hw+0.25, cz=hd+0.25, CH=H+0.6; b.box(0.06,CH,0.06,cx,0,cz,P); b.add(G.box,P,cx-0.45,CH-0.1,cz-0.45,0,Math.PI/4,0.35,0.05,0.05,1.5);
    b.add(new THREE.CylinderGeometry(0.28,0.28,0.07,14),'#8a5a36',cx+0.2,0.32,cz,0,0,Math.PI/2); }
  const g=b.geom(); scafCache.set(key,g); return g;
}
function startConstruction(b){

  const sc=new THREE.Mesh(scaffoldGeom(def.w,def.d,H,big),bMat); sc.castShadow=true; sc.position.copy(b.mesh.position); sc.rotation.y=b.mesh.rotation.y; scene.add(sc);

function endConstruction(q,instant){

function updateBuilds(dt,time){

    if(!buildings.has(q.b.id)){ endConstruction(q,true); continue; }
    q.t+=dt/q.dur; const u=Math.min(1,q.t);

    const rise=u<0.1?0:(u<0.88?(u-0.1)/0.78:1), hNow=q.base+0.01+(q.H+0.05)*rise;
    q.cut.constant=hNow;
    if(u<0.9){ q.dust+=dt; if(q.dust>0.16){ q.dust=0; dustBurst(q.b,q.big?3:2); dustBurst(q.b,q.big?2:1,hNow); }
      q.deb+=dt; const rate=q.big?0.07:0.12; while(q.deb>rate){ q.deb-=rate; if(Math.random()<0.65) debrisToss(q.b,q.base,hNow); else debrisBurst(q.b,hNow,1,false); }

    q.sc.scale.y=u<0.88?1:Math.max(0.01,1-(u-0.88)/0.12);
    if(q.big){ const th=q.b.mesh.rotation.y, c=Math.cos(th), s=Math.sin(th), def=DEFS[q.b.type], lx=def.w/2+0.06-0.2, lz=def.d/2+0.06-0.2, hy=0.15+Math.abs(Math.sin(time*0.9))*q.H*0.95;
      q.hoist.position.set(q.b.mesh.position.x+lx*c+lz*s,hy+q.b.mesh.position.y,q.b.mesh.position.z-lx*s+lz*c); q.hoist.visible=u<0.88; }
    q.tick+=dt; if(q.tick>0.32&&u<0.88){ q.tick=0; sfx('hammer'); }
    if(u>=1) endConstruction(q,false); }
}

}
function drawUnits(time){

function recolorDry(g){

function envStep(dt,time){
  // upływ czasu: 1 doba ≈ 6 minut (dzień 70%, noc 30%)
  if(ENV.cycle){ ENV.phase=(ENV.phase+dt/360)%1; const p=ENV.phase;
    const t=p<0.7?p/0.7:(p<0.85?1:0); if(Math.abs(+timeInput.value-t)>0.0005){ timeInput.value=t; }
    const nt=p>=0.7?1-smooth(0.93,1.0,p):smooth(0.64,0.7,p); ENV.nightF+= (nt-ENV.nightF)*Math.min(1,dt*2); }
  else { const nt=ENV.night?1:0; ENV.nightF+=(nt-ENV.nightF)*Math.min(1,dt*1.6); if(Math.abs(nt-ENV.nightF)<0.002) ENV.nightF=nt; }
  const rt=ENV.weather==='rain'?1:0, ft=ENV.weather==='fog'?1:(ENV.weather==='rain'?0.35:0);
  ENV.rainF+=(rt-ENV.rainF)*Math.min(1,dt*1.2); ENV.fogF+=(ft-ENV.fogF)*Math.min(1,dt*1.2);
  applyTime();
  nightU.value=ENV.nightF;
  glowMat.opacity=Math.min(1,ENV.nightF*1.2)*(0.85+0.15*Math.sin(time*7)); glowMat.size=0.85+0.08*Math.sin(time*11);
  glowPts.visible=ENV.nightF>0.02&&!todayMode;
  starsEl.style.opacity=(ENV.nightF*(1-ENV.fogF*0.8)*(1-ENV.rainF)).toFixed(3);
  // mgła
  const dist=camera.position.distanceTo(controls.target);
  if(!scene.fog) scene.fog=new THREE.Fog('#dfe6ea',10,100); scene.fog.color.copy(_skyD2);
  const hzN=Math.max(dist*1.4,N*0.75), hzF=Math.max(dist*3.2,N*2.6);
  scene.fog.near=hzN+(dist*(1.25)-hzN)*ENV.fogF*0.9; scene.fog.far=hzF+(dist*(3.4-1.7)-hzF)*ENV.fogF*0.9;
  // deszcz – krople wokół kamery
  rainLines.material.opacity=ENV.rainF*0.55; rainLines.visible=ENV.rainF>0.02;
  if(rainLines.visible){ const cx=controls.target.x, cz=controls.target.z, R=Math.min(30,dist*0.9), H=Math.max(8,dist*0.6);
    for(let k=0;k<RAIN_N;k++){ const s=rainSeed[k]; const y=((s[2]*H - time*9*(0.8+s[0]*0.4))%H+H)%H;
      const x=cx+(s[0]-0.5)*2*R, z=cz+(s[1]-0.5)*2*R, o=k*6; rainPos[o]=x; rainPos[o+1]=y; rainPos[o+2]=z; rainPos[o+3]=x+0.03; rainPos[o+4]=y+0.35; rainPos[o+5]=z+0.02; }
    rainGeo.attributes.position.needsUpdate=true; }
}

  for(const m of lineMeshes.values()){ const u=m.userData; if(u.target==null||Math.abs(u.ts-u.target)<0.002) continue; u.ts+=(u.target-u.ts)*k; m.scale.y=Math.max(0.001,u.ts); }
}

  let loaded=false;
  migrateSaves();
  const cid=lsGet(CUR_KEY), meta=getSlots().find(x=>x.id===cid)||getSlots()[0];
  if(meta){ const d=lsGet('urbs-slot-'+meta.id); if(d){ try{ deserialize(d); curSlot={id:meta.id,name:meta.name}; loaded=true; }catch(e){ console.warn(e); } } }
  if(!loaded){ romeTrajan(); curSlot={id:newSlotId(),name:'Rzym · 117 n.e.'}; }
  updateEraLabel();
  undoStack.length=0; saveCurrent(false);
  renderIcons();
  renderCats(); selectTool('camera');
  applyControlMode();
  window.__urbsReady=true;
  document.getElementById('loading').remove();
  requestAnimationFrame(loop);
  if(!loaded) setTimeout(()=>showInfo('rome'),700);
  else { let seen=false; try{ seen=localStorage.getItem('urbs-news-5')==='1'; localStorage.setItem('urbs-news-5','1'); }catch(e){} if(!seen) setTimeout(()=>showInfo('news'),900); }
}
start();
if('serviceWorker' in navigator&&location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
