.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}

function shadeGeom(g){
  const pos=g.attributes.position, col=g.attributes.color, nor=g.attributes.normal;
  for(let v=0;v<pos.count;v++){
    const ny=nor.getY(v), y=pos.getY(v);
    let f=1;
    if(Math.abs(ny)<0.6){ const t=clamp(y/0.45,0,1); f=0.58+0.42*(t*t*(3-2*t)); }
    else if(ny<-0.6) f=0.55;
    col.setXYZ(v,col.getX(v)*f,col.getY(v)*f,col.getZ(v)*f);
  }
  col.needsUpdate=true;
}

        if(ty<0.45){ setInst(TR.trunk,n.trunk++,x+ox,0,z+oz,sc,0.08*sc,sc); setInst(TR.cyp,n.cyp++,x+ox,0.06,z+oz,sc,0.8*sc,sc); }
        else if(ty<0.72){ setInst(TR.trunk,n.trunk++,x+ox,0,z+oz,sc,0.55*sc,sc); setInst(TR.pine,n.pine++,x+ox,0.6*sc,z+oz,sc,sc,sc); }
        else { setInst(TR.trunk,n.trunk++,x+ox,0,z+oz,sc*1.2,0.22*sc,sc*1.2); setInst(TR.olive,n.olive++,x+ox,0.3*sc,z+oz,sc,0.8*sc,sc); } }
    }
    if(t===0 && !occ && hash2(i,j,77)<0.035) setInst(TR.bush,n.bush++,x+(hash2(i,j,78)-0.5)*0.6,0.05,z+(hash2(i,j,79)-0.5)*0.6,1,0.8,1);
  }
  for(const k in T){ T[k].count=n[k]; T[k].instanceMatrix.needsUpdate=true; }
  for(const k in TR){ TR[k].count=n[k]; TR[k].instanceMatrix.needsUpdate=true; }
}

/* ---- linie ---- */
function lineAt(i,j){ return inb(i,j)?line[I(i,j)]:0; }
function lineKey(i,j){
  const k=lineAt(i,j); if(!k) return null;
  const nE=lineAt(i+1,j)===k, nW=lineAt(i-1,j)===k, nN=lineAt(i,j-1)===k, nS=lineAt(i,j+1)===k;
  const hx=nE||nW, hz=nN||nS;
  const mask=(nE?1:0)+(nW?2:0)+(nN?4:0)+(nS?8:0);
  if(k===1){
    if(hx&&hz) return 'tower-'+mask;
    const r=road[I(i,j)];
    let ax=hz?'z':'x';
    if(!hx&&!hz&&r){ const rx=(inb(i+1,j)&&road[I(i+1,j)])||(inb(i-1,j)&&road[I(i-1,j)]); ax=rx?'z':'x'; }
    if(r) return 'gate-'+ax;
    const cnt=(nE?1:0)+(nW?1:0)+(nN?1:0)+(nS?1:0);
    if(cnt<=1) return 'tower-'+mask;
    if((ax==='x'?i:j)%6===0) return 'tower-'+mask;
    return 'wall-'+ax;
  }
  if(hx&&hz) return 'aqp-'+((nE?1:0)+(nW?2:0)+(nN?4:0)+(nS?8:0));
  return 'aq-'+(hz?'z':'x');
}
function markLine(i,j){ dirtyLines.add(I(i,j)); for(const [di,dj] of DIRS) if(inb(i+di,j+dj)) dirtyLines.add(I(i+di,j+dj)); }
function processLines(){
  for(const id of dirtyLines){
    const i=id%N, j=Math.floor(id/N); const key=lineKey(i,j); const ex=lineMeshes.get(id);
    if(!key){ if(ex){ lineGroup.remove(ex); lineMeshes.delete(id); } continue; }
    if(ex && ex.userData.key===key) continue;
    const m=new THREE.Mesh(lineGeom(key),bMat); m.castShadow=m.receiveShadow=true; m.userData.key=key;
    m.position.set(wx(i),0,wx(j));
    if(ex) lineGroup.remove(ex); else { m.scale.set(1,0.01,1); growing.push({m,t:0}); }
    lineGroup.add(m); lineMeshes.set(id,m);
    if(todayMode){ lineToday(m); m.userData.ts=m.userData.target; m.scale.y=m.userData.ts; const gi=growing.findIndex(g=>g.m===m); if(gi>=0) growing.splice(gi,1); }
  }
  dirtyLines.clear();
}

/* ---- budynki ---- */
function fpSize(def,rot){ return rot%2?[def.d,def.w]:[def.w,def.d]; }
function canPlace(type,x,z,rot){
  const def=DEFS[type]; const [fw,fd]=fpSize(def,rot);
  for(let j=z;j<z+fd;j++) for(let i=x;i<x+fw;i++){
    if(!inb(i,j)) return false; const id=I(i,j);
    if(bld[id]||line[id]) return false;
    if(road[id]&&!def.onRoad) return false;
    if(terrain[id]===2) return false;
    if(onlyPlots && !def.decor && terrain[id]!==1) return false;
  }
  return true;
}
function addBuilding(type,x,z,rot,seed,anim=true,lm=null){
  const def=DEFS[type]; const [fw,fd]=fpSize(def,rot); const id=nextId++;
  for(let j=z;j<z+fd;j++) for(let i=x;i<x+fw;i++) bld[I(i,j)]=id;
  const m=new THREE.Mesh(getGeom(type,seed),bMat); m.castShadow=m.receiveShadow=true;
  m.position.set(x+fw/2-N/2,0,z+fd/2-N/2); m.rotation.y=rot*Math.PI/2;
  if(anim){ m.scale.set(0.01,0.01,0.01); growing.push({m,t:0}); }
  buildGroup.add(m);
  buildings.set(id,{id,type,x,z,rot,seed,mesh:m,lm:lm||null,ts:1});
  if(todayMode){ applyTodayTo(buildings.get(id),true); }
  labelsDirty=true;
  dirtyTerrain=true; dirtyRoads=true; dirtySave=true;
  return id;
}
function removeBuilding(id){
  const b=buildings.get(id); if(!b) return;
  const [fw,fd]=fpSize(DEFS[b.type],b.rot);
  for(let j=b.z;j<b.z+fd;j++) for(let i=b.x;i<b.x+fw;i++) if(inb(i,j)&&bld[I(i,j)]===id) bld[I(i,j)]=0;
  buildGroup.remove(b.mesh); buildings.delete(id); labelsDirty=true;
  chariots.delete(id);
  dirtyTerrain=true; dirtyRoads=true; dirtySave=true;
}
function frontHasRoad(x,z,fw,fd,rot){
  const cells=[]; if(rot===0) for(let i=x;i<x+fw;i++) cells.push([i,z+fd]); else if(rot===1) for(let j=z;j<z+fd;j++) cells.push([x+fw,j]);
  else if(rot===2) for(let i=x;i<x+fw;i++) cells.push([i,z-1]); else for(let j=z;j<z+fd;j++) cells.push([x-1,j]);
  return cells.some(([i,j])=>inb(i,j)&&road[I(i,j)]);
}
function bestRot(type,x,z){ const def=DEFS[type]; const order=[0,1,2,3].sort(()=>rnd()-0.5);
  for(const r of order){ const [fw,fd]=fpSize(def,r); if(canPlace(type,x,z,r)&&frontHasRoad(x,z,fw,fd,r)) return r; }
  for(const r of order) if(canPlace(type,x,z,r)) return r; return -1; }
function setRoad(i,j,v){ const id=I(i,j); if(road[id]===v) return false; road[id]=v; dirtyTerrain=true; dirtyRoads=true; dirtySave=true; if(line[id]) markLine(i,j); return true; }
function setLine(i,j,v){ const id=I(i,j); if(line[id]===v) return false; line[id]=v; markLine(i,j); dirtyTerrain=true; dirtySave=true; return true; }
function setTerrain(i,j,v){ const id=I(i,j); if(terrain[id]===v) return false; if(v===2&&bld[id]) return false; terrain[id]=v; dirtyTerrain=true; dirtySave=true; return true; }
function bulldoze(i,j){
  const id=I(i,j);
  if(bld[id]){ removeBuilding(bld[id]); return true; }
  if(line[id]){ setLine(i,j,0); return true; }
  if(road[id]){ setRoad(i,j,0); return true; }
  if(terrain[id]){ setTerrain(i,j,0); return true; }
  return false;
}
function clearCell(i,j){ const id=I(i,j); if(bld[id]) removeBuilding(bld[id]); setLine(i,j,0); setRoad(i,j,0); setTerrain(i,j,0); }

/* =========================================================
   Zapis / odczyt / cofanie
   ========================================================= */
function rle(a){ const out=[]; let prev=a[0],c=0; for(let k=0;k<a.length;k++){ if(a[k]===prev) c++; else { out.push(prev+'*'+c); prev=a[k]; c=1; } } out.push(prev+'*'+c); return out.join(','); }
function unrle(s,n){ const a=new Uint8Array(n); let p=0; for(const part of s.split(',')){ const [v,c]=part.split('*').map(Number); a.fill(v,p,p+c); p+=c; } return a; }
function serialize(){ const bl=[]; for(const b of buildings.values()) bl.push(b.lm?[b.type,b.x,b.z,b.rot,b.seed,b.lm]:[b.type,b.x,b.z,b.rot,b.seed]); return JSON.stringify({v:2,N,t:rle(terrain),r:rle(road),l:rle(line),b:bl}); }
function clearWorld(){
  for(const b of buildings.values()) buildGroup.remove(b.mesh); buildings.clear();
  for(const m of lineMeshes.values()) lineGroup.remove(m); lineMeshes.clear();
  growing.length=0; agents.length=0; patrols.length=0; chariots.clear();
}
function resizeWorld(n){ clearWorld(); alloc(n); buildBoard(); resetCamera(); dirtyTerrain=true; dirtyRoads=true; }
function deserialize(str){
  const o=JSON.parse(str); if(!o||!o.N) throw new Error('zły zapis');
  if(o.N!==N) resizeWorld(o.N); else { clearWorld(); alloc(o.N); }
  terrain.set(unrle(o.t,N*N)); road.set(unrle(o.r,N*N)); line.set(unrle(o.l,N*N));
  for(const [type,x,z,rot,seed,lm] of o.b){ if(!DEFS[type]) continue; addBuilding(type,x,z,rot,seed,false,lm||null); }
  if(todayMode) for(let id=0;id<N*N;id++) if(line[id]) dirtyLines.add(id);
  for(let id=0;id<N*N;id++) if(line[id]) dirtyLines.add(id);
  dirtyTerrain=true; dirtyRoads=true; dirtySave=true;
}
const undoStack=[];
function pushUndo(snap){ undoStack.push(snap||serialize()); if(undoStack.length>40) undoStack.shift(); }
function undo(){ if(!undoStack.length){ toast('Nie ma czego cofnąć'); return; } deserialize(undoStack.pop()); sfx('thud'); }
function autosave(){ if(!dirtySave) return; dirtySave=false; try{ localStorage.setItem('urbs-save-v2',serialize()); }catch(e){} }

/* =========================================================
   Generatory: castrum i krajobraz
   ========================================================= */
function lPath(a,b){
  a={i:clamp(a.i,0,N-1),j:clamp(a.j,0,N-1)}; b={i:clamp(b.i,0,N-1),j:clamp(b.j,0,N-1)};
  const out=[]; const di=Math.sign(b.i-a.i), dj=Math.sign(b.j-a.j); let i=a.i, j=a.j; out.push([i,j]);
  if(Math.abs(b.i-a.i)>=Math.abs(b.j-a.j)){ while(i!==b.i){i+=di;out.push([i,j]);} while(j!==b.j){j+=dj;out.push([i,j]);} }
  else { while(j!==b.j){j+=dj;out.push([i,j]);} while(i!==b.i){i+=di;out.push([i,j]);} }
  return out;
}
function tryPlaceIn(type,bx0,bz0,bw,bd,center=true){
  const def=DEFS[type]; const cand=[];
  for(const r of [0,1,2,3]){ const [fw,fd]=fpSize(def,r); if(fw>bw||fd>bd) continue;
    const xs=center?[bx0+Math.floor((bw-fw)/2)]:[...Array(bw-fw+1).keys()].map(k=>bx0+k);
    const zs=center?[bz0+Math.floor((bd-fd)/2)]:[...Array(bd-fd+1).keys()].map(k=>bz0+k);
    for(const x of xs) for(const z of zs) if(canPlace(type,x,z,r)) cand.push({x,z,r,f:frontHasRoad(x,z,fw,fd,r)}); }
  if(!cand.length) return false;
  const c=cand.find(c=>c.f)||cand[0]; addBuilding(type,c.x,c.z,c.r,Math.floor(rnd()*1e6),false); return true;
}
function fillHouses(bx0,bz0,bw,bd,dens=1){
  for(let j=bz0;j<bz0+bd;j++) for(let i=bx0;i<bx0+bw;i++){
    if(!inb(i,j)||bld[I(i,j)]) continue; if(dens<1&&rnd()>dens) continue; const p=rnd();
    if(p<0.3 && i+1<bx0+bw && j+1<bz0+bd){ const r=bestRot('insula',i,j); if(r>=0){ addBuilding('insula',i,j,r,Math.floor(rnd()*1e6),false); continue; } }
    if(p<0.55 && i+1<bx0+bw && j+1<bz0+bd){ const r=bestRot('domus',i,j); if(r>=0){ addBuilding('domus',i,j,r,Math.floor(rnd()*1e6),false); continue; } }
    const q=rnd(); let type=q<0.08?'taberna':q<0.11?'cypress':q<0.13?'fountain':'house';
    const r=bestRot(type,i,j); if(r>=0) addBuilding(type,i,j,r,Math.floor(rnd()*1e6),false);
  }
}
function makeCastrum(S,fill){
  S=Math.min(S,N-4);
  const x0=Math.floor((N-S)/2), z0=x0, x1=x0+S-1, z1=z0+S-1, cx=x0+Math.floor(S/2), cz=z0+Math.floor(S/2);
  for(let j=z0-1;j<=z1+1;j++) for(let i=x0-1;i<=x1+1;i++) if(inb(i,j)) clearCell(i,j);
  for(let i=x0;i<=x1;i++){ setLine(i,z0,1); setLine(i,z1,1); }
  for(let j=z0;j<=z1;j++){ setLine(x0,j,1); setLine(x1,j,1); }
  for(let k=0;k<N;k++){ if(!bld[I(cx,k)]) setRoad(cx,k,2); if(!bld[I(k,cz)]) setRoad(k,cz,2); }
  const streets=(c,a,b)=>{ const s=new Set([a+1,b-1,c]); for(let p=c-7;p>a+3;p-=7) s.add(p); for(let p=c+7;p<b-3;p+=7) s.add(p); return [...s].sort((u,v)=>u-v); };
  const xs=streets(cx,x0,x1), zs=streets(cz,z0,z1);
  for(const x of xs) for(let j=z0+1;j<=z1-1;j++) if(!road[I(x,j)]) setRoad(x,j,1);
  for(const z of zs) for(let i=x0+1;i<=x1-1;i++) if(!road[I(i,z)]) setRoad(i,z,1);
  for(let j=z0+1;j<z1;j++) for(let i=x0+1;i<x1;i++) if(!road[I(i,j)]) setTerrain(i,j,1);
  if(!fill) return;
  const blocks=[];
  for(let a=0;a<xs.length-1;a++) for(let c=0;c<zs.length-1;c++){ const bx=xs[a]+1, bz=zs[c]+1, bw=xs[a+1]-bx, bd=zs[c+1]-bz; if(bw>0&&bd>0) blocks.push({bx,bz,bw,bd,d:Math.hypot(bx+bw/2-cx,bz+bd/2-cz)}); }
  blocks.sort((p,q)=>p.d-q.d);
  const specials=[['forum'],['temple'],['baths'],['market','curia'],['pantheon'],['basilica','curia']];
  const used=new Set();
  for(const group of specials){ for(const blk of blocks){ if(used.has(blk)) continue; let ok=false; for(const t of group) ok=tryPlaceIn(t,blk.bx,blk.bz,blk.bw,blk.bd,!ok)||ok; if(ok){ used.add(blk); break; } } }
  const gate=blocks.filter(b=>!used.has(b)).sort((p,q)=>Math.hypot(p.bx-x0,p.bz+p.bd/2-cz)-Math.hypot(q.bx-x0,q.bz+q.bd/2-cz))[0];
  if(gate && tryPlaceIn('barracks',gate.bx,gate.bz,gate.bw,gate.bd)) used.add(gate);
  for(const blk of blocks) fillHouses(blk.bx,blk.bz,blk.bw,blk.bd);
  return {x0,z0,x1,z1,cx,cz};
}
function landscape(seed){
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const n=vnoise(i/6.5,j/6.5,seed); if(n>0.66) setTerrain(i,j,3); }
  for(let j=0;j<N;j++){ const c=Math.round(5+Math.sin(j*0.17+seed)*1.7); for(let i=c-1;i<=c+1;i++) if(inb(i,j)) setTerrain(i,j,2); }
  for(let k=0;k<7;k++){ const w=3+Math.floor(rnd()*4), d=4+Math.floor(rnd()*4), x=Math.floor(rnd()*(N-w)), z=Math.floor(rnd()*(N-d));
    for(let j=z;j<z+d;j++) for(let i=x;i<x+w;i++) if(terrain[I(i,j)]!==2) setTerrain(i,j,4); }
}

let tool={id:'camera',kind:'camera'};
let stroke=null, hoverCell=null;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hitP=new THREE.Vector3();
function cellAt(e){ const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);

const isPaint=()=>tool.kind==='terrain'||tool.kind==='bulldoze'||tool.kind==='brush';
let lastTick=0;
function paintAt(c){
  if(tool.kind==='terrain'){ for(const [i,j] of brushCells(c)) if(inb(i,j)&&setTerrain(i,j,tool.val)) stroke.changed=true; if(stroke.changed) tick(); }
  else if(tool.kind==='bulldoze'){ for(const [i,j] of brushCells(c)){ if(!inb(i,j)) continue; const id=I(i,j); if(stroke.visited.has(id)) continue; stroke.visited.add(id); if(bulldoze(i,j)){ stroke.changed=true; sfx('thud'); } } }
  else if(tool.kind==='brush'){ if(!inb(c.i,c.j)) return; const r=bestRot('house',c.i,c.j); if(r>=0){ addBuilding('house',c.i,c.j,r,Math.floor(rnd()*1e6)); stroke.changed=true; sfx('pop'); } }
}
function tick(){ const t=performance.now(); if(t-lastTick>70){ lastTick=t; sfx('tick'); } }
function paintLine(a,b){ const steps=Math.max(Math.abs(b.i-a.i),Math.abs(b.j-a.j)); for(let k=1;k<=steps;k++) paintAt({i:Math.round(a.i+(b.i-a.i)*k/steps),j:Math.round(a.j+(b.j-a.j)*k/steps)}); }

const pointers=new Map();

  const c=cellAt(e); if(!c) return;

let camDown=null; const pulses=[];
function endPointer(e){

  if(camDown&&e.pointerId===camDown.id){ const cd=camDown; camDown=null;
    if(Math.hypot(e.clientX-cd.x,e.clientY-cd.y)<8&&performance.now()-cd.t<600&&pointers.size===0){ const c=cellAt(e);
      if(c&&c.inside){ const id=bld[I(c.i,c.j)]; let key=null;
        if(id){ const b=buildings.get(id); key=b.lm&&INFO[b.lm]?b.lm:b.type; pulses.push({m:b.mesh,t:0}); }
        else if(line[I(c.i,c.j)]) key=line[I(c.i,c.j)]===1?'l-wall':'l-aq';

/* ---- dotyk: jeden palec przesuwa mapę, budowanie = stuknięcie + zatwierdzenie ---- */
let touchT=null, pending=null;
const actEl=document.getElementById('act');
function touchDown(e){
  if(pointers.size>1){ if(touchT){ clearTimeout(touchT.timer); if(touchT.hold){ controls.enabled=true; if(stroke){ if(isPaint()) cancelStroke(); else { stroke=null; } } } touchT=null; } return; }
  touchT={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),cell:cellAt(e),moved:false,hold:false,timer:0};
  if(tool.kind==='camera') return;
  if(isPaint()||tool.kind==='road'||tool.kind==='line'){
    touchT.timer=setTimeout(()=>{ const tt=touchT; if(!tt||tt.moved||pointers.size!==1) return; const c=tt.cell; if(!c) return;
      tt.hold=true; controls.enabled=false; try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){}
      pending=null; showAct();
      stroke={start:{i:c.i,j:c.j},last:c,cur:c,visited:new Set(),changed:false,x0:tt.x,y0:tt.y,pid:tt.id,moved:true,snap:null};
      if(isPaint()){ stroke.snap=serialize(); paintAt(c); }

  }
}
function touchUp(e){
  const tt=touchT; if(!tt||e.pointerId!==tt.id) return; touchT=null; clearTimeout(tt.timer);
  if(tt.hold){ controls.enabled=true; const s=stroke; stroke=null; if(!s) return;
    if(isPaint()){ if(s.changed) pushUndo(s.snap); prevTiles.count=0; }
    else { pending={kind:'path',start:s.start,end:{i:s.cur.i,j:s.cur.j}}; updatePreview(pending.end); showAct(); }
    return; }
  if(tt.moved||performance.now()-tt.t>700||pointers.size>0) return;
  const c=cellAt(e); if(!c) return;
  if(tool.kind==='camera'){ tapInfo(c); return; }
  if(tool.kind==='build'){
    if(pending&&pending.kind==='build'){ const rot=autoRotFor(tool.type,pending.c,buildRot); const f=footprint(pending.c,tool.type,rot);
      if(c.i>=f.x&&c.i<f.x+f.fw&&c.j>=f.z&&c.j<f.z+f.fd){ confirmPending(); return; } }
    pending={kind:'build',c:{i:c.i,j:c.j}}; updatePreview(pending.c); showAct(); sfx('tick'); return; }
  if(tool.kind==='road'||tool.kind==='line'){
    if(!pending){ pending={kind:'path',start:{i:c.i,j:c.j},end:{i:c.i,j:c.j}}; }
    else pending.end={i:c.i,j:c.j};
    updatePreview(pending.end); showAct(); sfx('tick'); return; }
  if(isPaint()){ const snap=serialize(); stroke={start:c,last:c,cur:c,visited:new Set(),changed:false,pid:-1,snap};
    paintAt(c); const ch=stroke.changed; stroke=null; if(ch) pushUndo(snap); else if(tool.kind==='brush') { toast('Tu nie zmieści się dom'); sfx('no'); }
    updatePreview(c); setTimeout(()=>{ if(!pending&&!stroke){ prevTiles.count=0; } },350); }
}
function tapInfo(c){
  if(!c.inside){ hideInfo(); return; } const id=bld[I(c.i,c.j)]; let key=null;
  if(id){ const b=buildings.get(id); key=b.lm&&INFO[b.lm]?b.lm:b.type; pulses.push({m:b.mesh,t:0}); }
  else if(line[I(c.i,c.j)]) key=line[I(c.i,c.j)]===1?'l-wall':'l-aq';
  else if(road[I(c.i,c.j)]) key=road[I(c.i,c.j)]===2?'r-wide':'r-narrow';
  if(key&&INFO[key]){ showInfo(key); sfx('tick'); } else hideInfo();
}
function confirmPending(){
  if(!pending) return; const p=pending;

}

function showAct(){

function resetCamera(){ controls.target.set(0,0,0); camera.position.set(N*0.42,N*0.48,N*0.62); controls.update(); }
let camAnim=null;
function rotateView(dir){ camAnim={left:dir*Math.PI/4}; }
const keys=new Set();
function camStep(dt){
  if(camAnim){ const step=Math.sign(camAnim.left)*Math.min(Math.abs(camAnim.left),dt*3.2); camAnim.left-=step;
    const off=camera.position.clone().sub(controls.target); off.applyAxisAngle(_Y,step); camera.position.copy(controls.target).add(off);
    if(Math.abs(camAnim.left)<1e-4) camAnim=null; }
  let mx=0,mz=0; if(keys.has('w')||keys.has('arrowup')) mz-=1; if(keys.has('s')||keys.has('arrowdown')) mz+=1; if(keys.has('a')||keys.has('arrowleft')) mx-=1; if(keys.has('d')||keys.has('arrowright')) mx+=1;
  if(mx||mz){ const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    const sp=dt*camera.position.distanceTo(controls.target)*0.8; const mv=fwd.multiplyScalar(-mz*sp).add(right.multiplyScalar(mx*sp)); camera.position.add(mv); controls.target.add(mv); }
  const t=controls.target, h=N/2; const cx=clamp(t.x,-h,h), cz=clamp(t.z,-h,h), dx=cx-t.x, dz=cz-t.z;
  if(dx||dz||t.y!==0){ const dy=-t.y; t.set(cx,0,cz); camera.position.x+=dx; camera.position.z+=dz; camera.position.y+=dy; }
}
window.addEventListener('keydown',e=>{

  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); undo(); return; }
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); e.preventDefault(); }
  if(k==='r') rotateBuilding(); if(k==='q') rotateView(-1); if(k==='e') rotateView(1); if(k==='g') toggleGrid();

let actx=null;
function ensureAudio(){ if(actx||muted) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function sfx(type){
  if(muted||!actx) return;
  try{ const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain(); o.connect(g); g.connect(actx.destination);
    const P={pop:['sine',620,260,0.12,0.14],tick:['sine',900,700,0.04,0.035],thud:['triangle',180,60,0.16,0.18],no:['square',220,180,0.12,0.04]}[type]||['sine',500,300,0.1,0.1];
    o.type=P[0]; o.frequency.setValueAtTime(P[1]*(0.92+Math.random()*0.16),t); o.frequency.exponentialRampToValueAtTime(P[2],t+P[3]);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(P[4],t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+P[3]+0.04);
    o.start(t); o.stop(t+P[3]+0.06); }catch(e){}
}

  const t=+timeInput.value, el=Math.sin(t*Math.PI), warm=Math.pow(1-el,1.6);
  const dir=new THREE.Vector3(-Math.cos(t*Math.PI)*1.1,0.18+el*1.25,0.55).normalize();
  sun.position.copy(dir).multiplyScalar(N*1.6); sun.target.position.set(0,0,0);
  sun.color.set('#fff1dc').lerp(new THREE.Color('#ff9a55'),warm); sun.intensity=1.5+2.1*el;
  hemi.color.set('#f4f0ff').lerp(new THREE.Color('#ffc9a0'),warm*0.7); hemi.intensity=0.62+0.38*el;
  const s1=new THREE.Color('#cfe6ee').lerp(new THREE.Color('#f4b48a'),warm), s2=new THREE.Color('#f6ead5').lerp(new THREE.Color('#f9dcbc'),warm);
  document.documentElement.style.setProperty('--sky1','#'+s1.getHexString()); document.documentElement.style.setProperty('--sky2','#'+s2.getHexString());

  else if(isTouch){
    if(tool.kind==='build') h='Stuknij miejsce – pojawi się podgląd. Stuknij go jeszcze raz albo ✓, aby postawić · '+camHint;
    else if(tool.kind==='road'||tool.kind==='line') h='Stuknij początek i koniec, potem ✓ · albo przytrzymaj palec i rysuj · '+camHint;
    else if(tool.kind==='bulldoze') h='Stuknij, aby burzyć · przytrzymaj i przeciągnij, aby burzyć więcej · '+camHint;
    else h='Stuknij, aby malować · przytrzymaj i przeciągnij, aby malować dalej · '+camHint;
  }
  else if(tool.kind==='build') h=(DEFS[tool.type].desc||('Kliknij, aby postawić: '+DEFS[tool.type].name))+' · R obraca'+(DEFS[tool.type].onRoad?' · można stawiać na drodze':'')+' · '+camHint;
  else if(tool.kind==='bulldoze') h='Kliknij lub przeciągnij, aby burzyć · '+camHint;
  else h=(tool.hint||'')+' · '+camHint;
  hintEl.textContent=h; hintEl.style.opacity=tool.kind==='camera'&&hintShown?0:1; clearTimeout(hintT); hintT=setTimeout(()=>{ hintEl.style.opacity=0; },tool.kind==='camera'?3500:5000); if(tool.kind==='camera') hintShown=true;
  document.getElementById('bRotate').classList.toggle('hide',tool.kind!=='build'||isTouch);
  document.getElementById('bDone').classList.toggle('hide',tool.kind==='camera');
  document.getElementById('bInfo').classList.toggle('hide',!infoKeyFor(tool));
  document.getElementById('bBrush').classList.toggle('hide',!(tool.kind==='terrain'||tool.kind==='bulldoze'));
}
function rotateBuilding(){ buildRot=(buildRot+1)%4; if(tool.kind==='build'){ sfx('tick'); if(pending&&pending.kind==='build'){ updatePreview(pending.c); showAct(); } else updatePreview(hoverCell); } }
document.getElementById('bRotate').onclick=rotateBuilding;
document.getElementById('bDone').onclick=()=>{ itemsOpen=false; selectTool('camera'); };
document.getElementById('bInfo').onclick=()=>{ const k=infoKeyFor(tool); if(infoKey===k) hideInfo(); else showInfo(k); };
document.getElementById('bBrush').onclick=e=>{ brushSize=brushSize===1?3:1; e.currentTarget.textContent='Pędzel: '+brushSize; };
document.getElementById('bUndo').onclick=undo;
document.querySelectorAll('#segEra button').forEach(b=>b.onclick=()=>{ const on=b.dataset.v==='1'; if(on!==todayMode) setToday(on); });
document.getElementById('bLabels').onclick=e=>{ labelsOn=!labelsOn; e.currentTarget.classList.toggle('off',!labelsOn); };
document.getElementById('bLegacy').onclick=()=>{ if(infoKey==='legacy') hideInfo(); else showInfo('legacy'); };
document.getElementById('bRotL').onclick=()=>rotateView(-1);
document.getElementById('bRotR').onclick=()=>rotateView(1);
function toggleGrid(){ gridOn=!gridOn; if(gridLines) gridLines.visible=gridOn; document.getElementById('bGrid').classList.toggle('off',!gridOn); }
document.getElementById('bGrid').onclick=toggleGrid;
document.getElementById('bPeople').onclick=e=>{ peopleOn=!peopleOn; e.currentTarget.classList.toggle('off',!peopleOn); if(!peopleOn){ agents.length=0; patrols.length=0; } };
document.getElementById('bSound').onclick=e=>{ muted=!muted; e.currentTarget.textContent=muted?'🔇':'🔊'; if(!muted) ensureAudio(); };
let toastT=0; const toastEl=document.getElementById('toast');
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1500); }

/* =========================================================
   Ciekawostki historyczne

const INFO={
  forum:{era:'od VII–VI w. p.n.e.',text:'Serce Rzymu: plac targowy, miejsce przemówień, sądów, procesji i wyborów. Forum Romanum powstało w podmokłej dolinie między Palatynem a Kapitolem, którą osuszył wielki kanał – Cloaca Maxima.',
    facts:['Mównica Rostra wzięła nazwę od dziobów (rostra) okrętów zdobytych w bitwie pod Ancjum w 338 p.n.e.','Przez forum biegła Via Sacra – droga, którą wodzowie przejeżdżali w pochodach triumfalnych.','Cesarze budowali obok własne fora; największe, Forum Trajana, otwarto w 112 n.e.']},
  temple:{era:'Świątynia Jowisza na Kapitolu: wg tradycji 509 p.n.e.',text:'Rzymska świątynia stała na wysokim podium, a wchodziło się do niej tylko od frontu, po schodach – inaczej niż do greckiej, otoczonej stopniami ze wszystkich stron. W środku, w celli, stał posąg bóstwa.',
    facts:['Ofiary składano na ołtarzu przed świątynią, a nie w jej wnętrzu.','Jedna z najlepiej zachowanych świątyń tego typu to Maison Carrée w Nîmes we Francji.','Najważniejszą świątynią Rzymu była świątynia Jowisza Najlepszego Największego na Kapitolu.']},
  pantheon:{era:'ok. 113–125 n.e., cesarz Hadrian',text:'Świątynia „wszystkich bogów”. Obecny budynek wzniósł Hadrian na miejscu starszej świątyni Agryppy – dlatego na fryzie nadal widnieje napis M·AGRIPPA.',
    facts:['Kopuła ma 43,3 m średnicy – dokładnie tyle, ile wynosi wysokość wnętrza, więc w środku zmieściłaby się kula.','To do dziś największa kopuła z niezbrojonego betonu na świecie; ku górze beton jest coraz lżejszy (dodawano pumeks).','Jedynym oknem jest okrągły otwór na szczycie – oculus – o średnicy ok. 8 m. Od 609 r. budynek jest kościołem i dzięki temu przetrwał.']},
  basilica:{era:'od II w. p.n.e.',text:'Bazylika nie była świątynią, tylko wielką krytą halą: odbywały się w niej sądy, spotkania kupców i załatwiano interesy, gdy na forum padał deszcz.',
    facts:['Bazylika Emilia powstała w 179 p.n.e., a Bazylika Julia, ufundowana przez Cezara, została poświęcona w 46 p.n.e.','Plan z wysoką nawą główną i oknami nad niższymi nawami bocznymi przejęły później kościoły chrześcijańskie.','Ogromną Bazylikę Maksencjusza ukończył ok. 312 n.e. cesarz Konstantyn.']},
  curia:{era:'Curia Julia: 44–29 p.n.e.',text:'Siedziba senatu rzymskiego. Budowę Curii Julii rozpoczął Juliusz Cezar, a ukończył August.',
    facts:['Budynek, który stoi dziś na forum, to odbudowa cesarza Dioklecjana po pożarze z 283 n.e.','Przetrwał niemal w całości, bo w VII w. zamieniono go w kościół.','Senatorowie nie siedzieli w ławkach, lecz na szerokich stopniach ciągnących się wzdłuż ścian.']},
  market:{era:'macellum: od II w. p.n.e.',text:'Macellum to targ, na którym sprzedawano mięso, ryby, warzywa i owoce. Zwykle miał dziedziniec otoczony kramami i okrągły pawilon (tholos) pośrodku.',
    facts:['Targi Trajana (ok. 100–110 n.e.) to wielopiętrowy kompleks sklepów i biur – często nazywany pierwszym „centrum handlowym”.','Nad porządkiem na targach i miarami wag czuwali urzędnicy – edylowie.']},
  baths:{era:'pierwsze wielkie termy w Rzymie: Agryppa, ok. 25 p.n.e.',text:'Termy były czymś więcej niż łaźnią: ćwiczono tu w palestrze, rozmawiano, załatwiano interesy. Kąpiel szła po kolei: przebieralnia, ciepłe tepidarium, gorące caldarium i zimne frigidarium.',
    facts:['Podłogi i ściany ogrzewał hypokaust: gorące powietrze z pieca płynęło pod podłogą opartą na słupkach z cegieł.','Wstęp kosztował grosze – często jednego quadransa, najmniejszą monetę. Dzieci wchodziły za darmo.','Wodę doprowadzały akwedukty, a woda zużyta w termach płukała potem kanały.']},
  caracalla:{era:'ok. 212–216 n.e., cesarz Karakalla',text:'Jedne z największych i najwspanialszych term Rzymu. Oprócz basenów i sal kąpielowych miały ogrody, palestry i dwie biblioteki – grecką i łacińską.',
    facts:['Mogły przyjąć jednocześnie ok. 1600 kąpiących się.','Ogromne okrągłe caldarium przykrywała kopuła zbliżona rozmiarem do kopuły Panteonu.','Działały ponad 300 lat – do 537 r., gdy Ostrogoci podczas oblężenia przecięli akwedukty. Dziś latem w ruinach wystawia się opery.']},
  diocletian:{era:'298–306 n.e., cesarz Dioklecjan',text:'Największe termy starożytnego Rzymu – kompleks zajmował ok. 13 hektarów.',
    facts:['Mogły pomieścić nawet ok. 3000 kąpiących się naraz.','W XVI w. Michał Anioł przebudował frigidarium na bazylikę Santa Maria degli Angeli e dei Martiri – działa do dziś.','Półkolista egzedra term wyznacza dziś kształt Piazza della Repubblica w Rzymie.']},
  colosseum:{era:'ok. 70–80 n.e., Wespazjan i Tytus',text:'Amfiteatr Flawiuszów. Budowę zaczął cesarz Wespazjan, a otworzył go jego syn Tytus w 80 n.e. igrzyskami, które trwały 100 dni. Odbywały się tu walki gladiatorów i polowania na dzikie zwierzęta.',
    facts:['Mieścił ok. 50 000 widzów; ma ok. 189 × 156 m i ok. 48 m wysokości.','Przed słońcem chroniło widzów velarium – płócienny dach, który rozpinali marynarze cesarskiej floty.','Pod areną znajdowało się hypogeum: korytarze, klatki i windy, którymi wypuszczano zwierzęta na arenę.']},
  circus:{era:'wg tradycji od VI w. p.n.e.',text:'Circus Maximus – najstarszy i największy tor wyścigów rydwanów w Rzymie, długi na ok. 600 m. Mógł pomieścić ok. 150 000 widzów.',
    facts:['Wyścig trwał 7 okrążeń; licznikiem były drewniane jaja i brązowe delfiny na spinie – delfiny dodał Agryppa w 33 p.n.e.','Kibicowano czterem stronnictwom: Czerwonym, Białym, Zielonym i Niebieskim – w grze rydwany mają te same barwy.','Obelisk na spinie sprowadził z Egiptu August w 10 p.n.e.; dziś stoi na Piazza del Popolo.']},
  theatre:{era:'pierwszy kamienny teatr: Pompejusz, 55 p.n.e.',text:'Wcześniej teatry w Rzymie stawiano z drewna i rozbierano po przedstawieniach. Pierwszy stały, kamienny teatr zbudował Pompejusz – na szczycie widowni umieścił świątynię Wenus.',
    facts:['Półkolistą widownię nazywano cavea, a ozdobną, wielokondygnacyjną ścianę za sceną – scaenae frons.','Teatr Marcellusa, ukończony za Augusta, stoi do dziś – w średniowieczu przerobiono go na twierdzę, a później na pałac.']},
  barracks:{era:'castra – od czasów republiki',text:'Legion w marszu co wieczór budował obóz według tego samego planu: prostokąt z wałem i rowem oraz dwiema głównymi drogami, via principalis i via praetoria. W środku stała komendantura – principia.',
    facts:['Ośmiu żołnierzy dzieliło namiot i muła – to contubernium. Dziesięć contubernia tworzyło centurię (80 ludzi).','Wiele miast wyrosło z obozów legionowych, np. Wiedeń (Vindobona) czy York (Eboracum).','Gwardia pretoriańska miała w Rzymie własny obóz – Castra Praetoria (ok. 23 n.e.).']},
  domus:{era:'od czasów republiki',text:'Dom zamożnej rodziny, zwrócony do wnętrza. Przez otwór w dachu (compluvium) deszczówka spływała do basenu (impluvium) w atrium, a z tyłu domu był perystyl – ogród otoczony kolumnadą.',
    facts:['Od strony ulicy domus często miał tylko drzwi i małe okna, a pomieszczenia od frontu wynajmowano jako sklepy.','W Pompejach przy wejściu do jednego z domów zachowała się mozaika z psem i napisem CAVE CANEM – „uważaj na psa”.']},
  insula:{era:'od III w. p.n.e.',text:'Czynszowa kamienica, w której mieszkała większość Rzymian. Na parterze były sklepy, wyżej mieszkania – im wyżej, tym ciaśniejsze i tańsze, bez wody i bardziej zagrożone pożarem.',
    facts:['August ograniczył wysokość budynków do ok. 70 stóp (ok. 21 m).','Spisy z IV w. podają, że w Rzymie było ok. 46 000 insul i tylko ok. 1800 domów jednorodzinnych.']},
  taberna:{era:'cały okres rzymski',text:'Mały sklep albo warsztat na parterze, otwarty szeroko na ulicę i zamykany na noc drewnianymi okiennicami.',
    facts:['Thermopolium było barem z gorącym jedzeniem: w murowaną ladę wpuszczano gliniane naczynia (dolia) z potrawami.','W Pompejach zachowało się ponad sto takich barów.']},
  house:{era:'',text:'Zwykłe kamienice i domy tworzące większość zabudowy rzymskiego miasta – tynkowane, kryte czerwoną dachówką.',facts:['Rzymianie wymyślili dachówki, które zakładały się na siebie: płaskie tegulae i półokrągłe imbrices.']},
  garden:{era:'',text:'Ogrody perystylowe były zieloną duszą domów: z fontannami, rzeźbami, ziołami i drzewami owocowymi.',facts:['W Pompejach archeolodzy odlali w gipsie ślady korzeni roślin i odtworzyli, co rosło w ogrodach sprzed 79 n.e.']},
  arch:{era:'Łuk Tytusa ok. 81 n.e., Łuk Konstantyna 315 n.e.',text:'Łuki triumfalne wznoszono na pamiątkę zwycięstw. Przez łuk przejeżdżał pochód triumfalny wodza.',
    facts:['Łuk Tytusa upamiętnia zdobycie Jerozolimy w 70 n.e. – na reliefie niesiona jest menora ze Świątyni Jerozolimskiej.','Łuk Konstantyna to największy zachowany łuk w Rzymie; część jego reliefów zabrano ze starszych pomników.','Wg przekazów za triumfatorem stał niewolnik, który przypominał mu, że jest tylko człowiekiem.']},
  fountain:{era:'',text:'Większość mieszkańców nie miała wody w domu – brali ją z publicznych fontann i basenów zasilanych przez akwedukty.',facts:['Według Pliniusza Agryppa zbudował w Rzymie ok. 700 basenów i 500 fontann.','Woda w fontannach płynęła bez przerwy – nadmiar spływał do kanałów.']},
  statue:{era:'',text:'Fora i ulice wypełniały posągi bogów, cesarzy i zasłużonych obywateli – z marmuru i brązu, często malowane na żywe kolory.',facts:['Brązowy posąg konny Marka Aureliusza (ok. 175 n.e.) przetrwał, bo przez wieki mylono go z Konstantynem, pierwszym chrześcijańskim cesarzem.']},
  column:{era:'Kolumna Trajana, 113 n.e.',text:'Kolumny honorowe upamiętniały cesarzy i ich zwycięstwa. Najsłynniejsza, Kolumna Trajana, ma trzon wysoki na 100 rzymskich stóp (ok. 30 m).',
    facts:['Spiralny fryz długości ok. 190 m opowiada jak komiks o wojnach Trajana z Dakami.','W środku są kręte schody na szczyt, a w cokole złożono urnę z prochami cesarza. Od 1587 r. na szczycie stoi posąg św. Piotra.']},
  cypress:{era:'',text:'Smukłe cyprysy były w starożytności drzewami związanymi z pamięcią o zmarłych – sadzono je przy grobowcach.',facts:['Rzymianie chowali zmarłych poza murami miasta, dlatego drogi wylotowe, jak Via Appia, obstawione były grobowcami.']},
  pine:{era:'',text:'Pinia o parasolowatej koronie to symbol krajobrazu wokół Rzymu.',facts:['Jej nasiona – orzeszki piniowe – jedzono już w starożytności.']},
  'r-narrow':{era:'',text:'Wąskie uliczki (vici) były brukowane, z wyższymi chodnikami po bokach.',facts:['W Pompejach na ulicach leżą duże kamienie, po których przechodziło się suchą nogą, a wozy przejeżdżały między nimi.']},
  'r-wide':{era:'Via Appia: 312 p.n.e.',text:'Rzymskie drogi budowano warstwami: podsypka z kamieni, żwir, ubita warstwa z zaprawą, a na wierzchu płyty bazaltu. Via Appia, „królowa dróg”, prowadziła z Rzymu na południe Italii.',
    facts:['Prawo Juliusza Cezara zakazało wozom wjazdu do Rzymu w ciągu dnia (poza wyjątkami) – nocą miasto huczało od kół.','W szczytowym okresie sieć rzymskich dróg liczyła dziesiątki tysięcy kilometrów.']},
  'l-aq':{era:'Aqua Appia: 312 p.n.e.',text:'Akwedukty doprowadzały wodę z gór do miasta wyłącznie siłą grawitacji. Większość ich długości biegła pod ziemią – na arkadach tylko przez doliny i niziny.',
    facts:['W czasach największego rozkwitu Rzym zasilało 11 akweduktów.','Spadek kanału bywał bardzo mały – często poniżej metra na kilometr.','Aqua Virgo z 19 p.n.e. do dziś zasila Fontannę di Trevi.']},
  'l-wall':{era:'Mur Serwiański IV w. p.n.e., Mur Aureliana 271–275 n.e.',text:'Pierwszy wielki mur Rzymu wzniesiono po złupieniu miasta przez Galów (ok. 390 p.n.e.). Przez stulecia pokoju miasto rozrosło się daleko poza niego.',
    facts:['Mur Aureliana miał ok. 19 km długości i 383 wieże – w dużej części stoi do dziś.','Bramy stały tam, gdzie mur przecinały drogi – w grze mur na drodze sam zamienia się w bramę.']},
};
let infoAuto=true, infoKey=null;
const infoEl=document.getElementById('info');
function infoKeyFor(t){ if(!t) return null; if(t.type&&INFO[t.type]) return t.type; if(INFO[t.id]) return t.id; return null; }
function showInfo(key){
  const d=INFO[key]; if(!d){ hideInfo(); return; }
  infoKey=key;
  const name=d.name||DEFS[key]?.name||TOOLS.find(t=>t.id===key)?.name||'';
  infoEl.innerHTML=`<button class="x" aria-label="Zamknij">×</button><div class="it">${name}</div>${d.era?`<div class="era">${d.era}</div>`:''}<p>${d.text}</p>${d.facts?.length?`<div class="dyk">${key==='legacy'?'Co zawdzięczamy Rzymianom':key==='rome'?'Jak oglądać makietę':'Czy wiesz, że…'}</div><ul>${d.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`:''}${d.today?`<div class="dyk today">🔗 Co zostało dziś</div>${d.surv!=null?`<div class="surv"><span style="width:${Math.round(d.surv*100)}%"></span></div>`:''}<p>${d.today}</p>`:''}${d.legacy?`<div class="dyk">🏗️ Dziedzictwo</div><p>${d.legacy}</p>`:''}`;
  infoEl.querySelector('.x').onclick=hideInfo;
  infoEl.classList.add('show'); infoEl.scrollTop=0;
}
function hideInfo(){ infoEl.classList.remove('show'); infoKey=null; }
Object.assign(INFO,{
  rome:{name:'Rzym za Trajana · ok. 117 n.e.',era:'Trajan panował w latach 98–117 n.e.',text:'Za Trajana imperium osiągnęło największy zasięg – od Brytanii po Mezopotamię. Rzym miał prawdopodobnie ok. miliona mieszkańców i był największym miastem świata zachodniego. To makieta poglądowa: dzielnice i budowle stoją we właściwym położeniu względem siebie, ale nie w skali.',
    facts:['W trybie ✋ Rozglądaj kliknij dowolną budowlę – zobaczysz jej historię i to, co z niej zostało.','Przełącznik „117 n.e. / Dziś” u góry pokazuje, co przetrwało – i czemu Forum to dziś „kupa kamieni”.','W menu ☰ znajdziesz „Dziedzictwo” – co zawdzięcza Rzymianom dzisiejsza inżynieria.','Tyber płynie z północy, okrąża Pole Marsowe i mija Wyspę Tyberyjską – na zachód od niego leży Zatybrze (Trastevere).']},
  legacy:{name:'Rzymskie fundamenty dzisiejszej inżynierii',era:'',text:'Wiele rozwiązań, z których korzystamy na co dzień, Rzymianie dopracowali – albo wymyślili – dwa tysiące lat temu.',
    facts:['<b>Beton.</b> Opus caementicium z popiołem wulkanicznym twardniał nawet pod wodą. Badania z 2023 r. pokazały, że grudki wapna w środku pozwalają mu samemu „zalepiać” rysy.',
      '<b>Łuk, sklepienie i kopuła.</b> Pozwoliły przekryć ogromne wnętrza i budować mosty. Most Trajana na Dunaju (105 n.e.) miał ponad 1 km i przez ponad tysiąc lat był najdłuższym mostem łukowym świata.',
      '<b>Wodociągi i kanalizacja.</b> Akwedukty, zbiorniki rozdzielcze i rury z ołowiu – po łacinie plumbum, stąd angielskie „plumbing”. Kanał Cloaca Maxima częściowo działa do dziś.',
      '<b>Drogi.</b> Warstwowa konstrukcja jak we współczesnych drogach, kamienie milowe i sieć dziesiątek tysięcy kilometrów utwardzonych dróg.',
      '<b>Stadiony.</b> Koloseum miało numerowane wejścia, sektory, korytarze do szybkiego opróżniania widowni i rozsuwany dach.',
      '<b>Ogrzewanie podłogowe.</b> Hypokaust ogrzewał termy i bogate domy ciepłym powietrzem pod posadzką.',
      '<b>Bloki i przepisy budowlane.</b> Wielopiętrowe insule, limity wysokości, przepisy przeciwpożarowe po pożarze w 64 n.e. i straż pożarna (vigiles).',
      '<b>Urbanistyka.</b> Siatka ulic z obozu wojskowego wyznacza do dziś centra wielu miast, np. Turynu.',
      '<b>Handel.</b> Targi Trajana to piętrowy kompleks sklepów – praprzodek galerii handlowej.']},

/* ---- menu ---- */
const modal=document.getElementById('modal'), card=document.getElementById('card');
function closeModal(){ modal.classList.add('hidden'); }
modal.addEventListener('pointerdown',e=>{ if(e.target===modal) closeModal(); });
function openMenu(){
  let hasOld=false; try{ hasOld=!!localStorage.getItem('urbs-save-v1'); }catch(e){}
  const sizes=[20,28,36,44,52].filter(x=>x<=N-6);
  const chip=(id,label,on)=>`<button class="chip${on?' on':''}" id="${id}">${label}</button>`;
  card.classList.add('sheet');
  card.innerHTML=`
  <div class="row" style="justify-content:space-between;margin:0"><h2>URBS</h2><button class="btn" id="mClose">✕</button></div>
  <div class="statline" id="mStats">${statsEl.textContent}</div>
  <h3>Widok</h3>
  <div class="sunrow"><span>🌅</span><input type="range" id="mTime" min="0" max="1" step="0.001" value="${timeInput.value}" aria-label="Pora dnia"><span>🌇</span></div>
  <div class="chips">${chip('cLabels','🏷️ Podpisy',labelsOn)}${chip('cPeople','🚶 Ludzie',peopleOn)}${chip('cGrid','# Siatka',gridOn)}${chip('cSound',muted?'🔇 Dźwięk':'🔊 Dźwięk',!muted)}</div>
  <h3>Wiedza</h3>
  <div class="chips"><button class="chip" id="cRome">🏛️ O makiecie</button><button class="chip" id="cLegacy">🏗️ Dziedzictwo Rzymian</button></div>
  <label class="ck"><input type="checkbox" id="mInfo" ${infoAuto?'checked':''}> Pokazuj historię przy wyborze budynku</label>
  <h3>Miasto</h3>
  <div class="chips"><button class="chip" id="mRome">🏛️ Rzym za Trajana</button><button class="chip" id="mDemo">🏕️ Przykładowe castrum</button>${hasOld?'<button class="chip" id="mOld">📂 Poprzednie miasto</button>':''}</div>
  <div class="row"><select id="mN"><option value="32">Mała 32×32</option><option value="48" selected>Średnia 48×48</option><option value="64">Duża 64×64</option></select>
  <label class="ck"><input type="checkbox" id="mLand" checked> rzeka i gaje</label><button class="btn" id="mNew">Pusta mapa</button></div>
  <div class="row"><select id="mCs">${sizes.map(x=>`<option value="${x}" ${x===28?'selected':''}>${x}×${x}</option>`).join('')}</select>
  <label class="ck"><input type="checkbox" id="mFill" checked> zabuduj</label><button class="btn" id="mCastrum">Wytycz castrum</button></div>
  <label class="ck"><input type="checkbox" id="mPlots" ${onlyPlots?'checked':''}> Buduj tylko na działkach</label>
  <h3>Zapis i instalacja</h3>
  <div class="chips">${isStandalone?'':'<button class="chip" id="mInstall">📲 Zainstaluj aplikację</button>'}<button class="chip" id="mCopy">📋 Kopiuj kod miasta</button><button class="chip" id="mLoad">📥 Wczytaj z kodu</button></div>
  <textarea id="mCode" placeholder="Tu pojawi się / tu wklej kod miasta"></textarea>
  <h3>Sterowanie</h3>
  <div class="keys">${isTouch?'<b>1 palec</b> przesuwa mapę, <b>2 palce</b> przybliżają i obracają, ⟲ ⟳ obracają o 45°. Budowanie: stuknij miejsce i zatwierdź <b>✓</b>. Mury i drogi: stuknij początek i koniec albo przytrzymaj palec i rysuj.':'<b>Lewy</b> buduje, <b>prawy</b> obraca, <b>kółko</b> przybliża, <b>środkowy</b> przesuwa · <b>WASD</b> przesuwanie · <b>Q/E</b> obrót · <b>R</b> obrót budynku · <b>Ctrl+Z</b> cofnij · <b>Esc</b> koniec budowania'}<br>W trybie rozglądania stuknij dowolną budowlę, aby poznać jej historię.</div>`;
  modal.classList.remove('hidden');
  const $=id=>card.querySelector('#'+id);
  const toggle=(id,btn)=>{ $(id).onclick=()=>{ document.getElementById(btn).click(); openMenu(); }; };
  $('mClose').onclick=closeModal;
  $('mTime').oninput=e=>{ timeInput.value=e.target.value; applyTime(); };
  toggle('cLabels','bLabels'); toggle('cPeople','bPeople'); toggle('cGrid','bGrid'); toggle('cSound','bSound');
  $('cRome').onclick=()=>{ closeModal(); showInfo('rome'); };
  $('cLegacy').onclick=()=>{ closeModal(); showInfo('legacy'); };
  $('mInfo').onchange=e=>{ infoAuto=e.target.checked; try{ localStorage.setItem('urbs-info',infoAuto?'1':'0'); }catch(_){} };
  $('mRome').onclick=()=>{ pushUndo(); if(todayMode) setToday(false); romeTrajan(); closeModal(); setTimeout(()=>showInfo('rome'),300); };
  $('mDemo').onclick=()=>{ pushUndo(); if(todayMode) setToday(false); defaultWorld(); closeModal(); };
  if(hasOld) $('mOld').onclick=()=>{ try{ const snap=serialize(); deserialize(localStorage.getItem('urbs-save-v1')); pushUndo(snap); closeModal(); }catch(e){ toast('Nie udało się wczytać'); } };
  $('mNew').onclick=()=>{ pushUndo(); const n=+$('mN').value; resizeWorld(n); if($('mLand').checked) landscape(Math.floor(rnd()*1000)); closeModal(); };
  $('mCastrum').onclick=()=>{ pushUndo(); makeCastrum(+$('mCs').value,$('mFill').checked); closeModal(); sfx('pop'); toast('Castrum wytyczone'); };
  $('mPlots').onchange=e=>{ onlyPlots=e.target.checked; };
  if(!isStandalone) $('mInstall').onclick=()=>openInstall();
  $('mCopy').onclick=async()=>{ const code=btoa(unescape(encodeURIComponent(serialize()))); $('mCode').value=code; try{ await navigator.clipboard.writeText(code); toast('Skopiowano kod miasta'); }catch(e){ $('mCode').select(); toast('Zaznacz i skopiuj kod z pola'); } };
  $('mLoad').onclick=()=>{ const v=$('mCode').value.trim(); if(!v){ toast('Wklej najpierw kod'); return; } try{ const snap=serialize(); deserialize(decodeURIComponent(escape(atob(v)))); pushUndo(snap); closeModal(); toast('Wczytano miasto'); }catch(e){ toast('Ten kod nie wygląda na miasto'); } };
}
document.getElementById('bMenu').onclick=openMenu;
/* ---- instalacja jako aplikacja ---- */
const isStandalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inFrame=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const SITE='https://pjotografia.vercel.app/urbs/';
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; document.getElementById('bInstall').classList.remove('hide'); });
if(!isStandalone && (isIOS||inFrame)) document.getElementById('bInstall').classList.remove('hide');
function openInstall(){
  if(installEvt&&!inFrame){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; }); return; }
  let body;
  if(inFrame||!location.hostname.endsWith('vercel.app')) body=`<p>Grę można zainstalować tylko z Twojej strony – tutaj, w podglądzie, się nie da.</p>
    <ol class="steps"><li>Otwórz w ${isIOS?'<b>Safari</b>':'przeglądarce'} adres:<br><b style="user-select:text;-webkit-user-select:text">${SITE}</b></li><li>Tam ponownie stuknij 📲 i postępuj według wskazówek.</li></ol>
    <div class="row"><a class="btn main" href="${SITE}" target="_blank" rel="noopener" style="text-decoration:none">Otwórz grę na stronie</a><button class="btn" id="cpy">Kopiuj adres</button></div>`;
  else if(isIOS) body=`<p>Na iPhonie i iPadzie dodaje się ją przez Safari:</p>
    <ol class="steps"><li>Upewnij się, że ta strona jest otwarta w <b>Safari</b> (nie w Chrome ani w aplikacji Instagrama czy Messengera).</li>
    <li>Stuknij przycisk <b>Udostępnij</b> <span class="share">↑</span> – na dole ekranu (albo na górze na iPadzie).</li>
    <li>Przewiń listę w dół i wybierz <b>„Do ekranu początkowego”</b>.</li>
    <li>Stuknij <b>„Dodaj”</b>. Na ekranie pojawi się ikonka Urbs ze świątynią.</li></ol>
    <p>Uruchomiona z ikonki gra otwiera się na pełnym ekranie i działa też bez internetu.</p>`;
  else body=`<p>W menu przeglądarki (⋮) wybierz <b>„Zainstaluj aplikację”</b> lub <b>„Dodaj do ekranu głównego”</b>. Na komputerze możesz też kliknąć ikonkę instalacji po prawej stronie paska adresu.</p>`;
  card.innerHTML=`<h2>Zainstaluj Urbs</h2>${body}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn main" id="iClose">Gotowe</button></div>`;
  modal.classList.remove('hidden');
  card.querySelector('#iClose').onclick=closeModal;
  const c=card.querySelector('#cpy'); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(SITE); toast('Skopiowano adres'); }catch(e){ toast(SITE); } };
}
document.getElementById('bInstall').onclick=openInstall;


/* ---- ikonki ---- */
function swatch(kind,val){
  const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d');
  const fill=(col)=>{ g.fillStyle=col; g.fillRect(0,0,96,96); };
  if(kind==='terrain'){
    if(val===0){ fill('#a9d17b'); g.fillStyle='#86b85e'; for(let k=0;k<6;k++){ g.beginPath(); g.arc(16+((k*37)%64),18+((k*53)%60),7,0,7); g.fill(); } }
    if(val===1){ fill('#a9d17b'); g.fillStyle='#ecdcb4'; g.fillRect(12,12,72,72); g.setLineDash([6,5]); g.strokeStyle='#c9b48a'; g.lineWidth=3; g.strokeRect(14,14,68,68); }
    if(val===2){ fill(WATERC); g.strokeStyle='#bfe8f2'; g.lineWidth=4; for(let y=22;y<90;y+=22){ g.beginPath(); for(let x=0;x<=96;x+=4) g.lineTo(x,y+Math.sin(x/9)*4); g.stroke(); } }
    if(val===3){ fill('#95c16a'); for(const [x,y,col] of [[30,62,CYP],[64,56,'#6a9a4a'],[48,34,'#9bb07a']]){ g.fillStyle=col; g.beginPath(); g.moveTo(x-12,y+10); g.lineTo(x,y-26); g.lineTo(x+12,y+10); g.fill(); } }
    if(val===4){ fill('#e8c867'); g.fillStyle='#d2ab45'; for(let y=10;y<96;y+=18) g.fillRect(6,y,84,7); }
  } else {
    fill('#a9d17b'); const w=val===2?44:30; g.fillStyle=val===2?'#aaa398':'#d4c9b6'; g.fillRect(48-w/2,0,w,96); g.fillRect(0,48-w/2,96,w);
    g.fillStyle='#efe7d8'; for(const o of [-w/2-3,w/2]){ g.fillRect(48+o,0,3,48-w/2); g.fillRect(48+o,48+w/2,3,48-w/2); g.fillRect(0,48+o,48-w/2,3); g.fillRect(48+w/2,48+o,48-w/2,3); }
    if(val===2){ g.fillStyle='rgba(255,255,255,.18)'; for(let y=4;y<96;y+=10) for(let x=30;x<66;x+=12) g.fillRect(x+(y%20?6:0),y,9,6); }
  }
  return c.toDataURL();
}
function renderIcons(){
  let r2; try{ r2=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); }catch(e){ return; }
  r2.setPixelRatio(1); r2.setSize(120,120); r2.setClearColor(0x000000,0);
  const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight('#fff6e6','#8a7a60',2.0)); const dl=new THREE.DirectionalLight('#fff3df',2.4); dl.position.set(4,7,5); sc.add(dl);
  const cam=new THREE.PerspectiveCamera(28,1,0.1,400);
  const shot=(meshes)=>{ const grp=new THREE.Group(); meshes.forEach(m=>grp.add(m)); sc.add(grp);
    const box=new THREE.Box3().setFromObject(grp); const sph=box.getBoundingSphere(new THREE.Sphere());
    const d=sph.radius/Math.sin(THREE.MathUtils.degToRad(14))*1.02; const dir=new THREE.Vector3(1,0.85,1.25).normalize();
    cam.position.copy(sph.center).addScaledVector(dir,d); cam.lookAt(sph.center); cam.updateMatrixWorld(); r2.render(sc,cam);
    const url=r2.domElement.toDataURL(); sc.remove(grp); return url; };
  const M=(g,x=0,z=0)=>{ const m=new THREE.Mesh(g,bMat); m.position.set(x,0,z); return m; };
  for(const t of TOOLS){
    try{
      if(t.kind==='terrain'||t.kind==='road') t.icon=swatch(t.kind,t.val);
      else if(t.kind==='brush') t.icon=shot([M(getGeom('house',3),-0.5,-0.5),M(getGeom('house',7),0.5,-0.5),M(getGeom('house',11),-0.5,0.5),M(getGeom('house',14),0.5,0.5)]);
      else if(t.id==='l-wall') t.icon=shot([M(lineGeom('tower-1'),-1),M(lineGeom('wall-x'),0),M(lineGeom('gate-x'),1),M(lineGeom('wall-x'),2),M(lineGeom('tower-2'),3)]);
      else if(t.id==='l-aq') t.icon=shot([M(lineGeom('aq-x'),-1),M(lineGeom('aq-x'),0),M(lineGeom('aq-x'),1)]);
      else if(t.type) t.icon=shot([M(getGeom(t.type,0))]);
    }catch(e){ console.warn('ikona',t.id,e); }
  }
  r2.dispose(); try{ r2.forceContextLoss(); }catch(e){}
}


/* =========================================================
   Tryb „Dziś” i podpisy budowli
   ========================================================= */
let todayMode=false;
const ruinMat=new THREE.MeshStandardMaterial({color:'#cfc3ad',roughness:0.95,flatShading:true,side:THREE.DoubleSide});
const TYPE_SURV={house:0,domus:0.03,insula:0.04,taberna:0,garden:0,fountain:0.3,statue:0.4,column:0.9,cypress:1,pine:1,arch:0.8,temple:0.15,forum:0.2,basilica:0.08,curia:0.9,market:0.5,baths:0.1,caracalla:0.45,diocletian:0.4,pantheon:1,colosseum:0.7,circus:0.02,theatre:0.5,barracks:0.1,palace:0.25,mausoleum:0.45,pyramid:1,trajanbaths:0.1};
function survOf(b){ const d=b.lm&&INFO[b.lm]; if(d&&d.surv!=null) return d.surv; return TYPE_SURV[b.type]??0; }
function applyTodayTo(b,instant){ const s=survOf(b); b.target=todayMode?s:1; b.mesh.material=(todayMode&&s<0.95)?ruinMat:bMat; if(instant){ b.ts=b.target; b.mesh.scale.y=Math.max(0.001,b.ts); b.mesh.visible=b.ts>0.012; } }
function lineToday(m){ const k=m.userData.key||''; const s=k.startsWith('aq')?0.45:0.3; m.userData.target=todayMode?s:1; if(m.userData.ts==null) m.userData.ts=1; m.material=todayMode?ruinMat:bMat; }
function setToday(on){
  todayMode=on; for(const b of buildings.values()) applyTodayTo(b,false); for(const m of lineMeshes.values()) lineToday(m);
  document.querySelectorAll('#segEra button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===on));
  if(on){ agents.forEach(a=>{ if(a.kind==='cart') a.life=-99; }); toast('Rzym dziś – tyle przetrwało do naszych czasów'); } else toast('Z powrotem w starożytności');
  sfx('pop');
}
function todayStep(dt){
  const k=Math.min(1,dt*3.2);
  for(const b of buildings.values()){ if(b.target==null||Math.abs(b.ts-b.target)<0.002) continue; b.ts+=(b.target-b.ts)*k; if(Math.abs(b.ts-b.target)<0.002) b.ts=b.target; b.mesh.scale.y=Math.max(0.001,b.ts); b.mesh.visible=b.ts>0.012; }
  for(const m of lineMeshes.values()){ const u=m.userData; if(u.target==null||Math.abs(u.ts-u.target)<0.002) continue; u.ts+=(u.target-u.ts)*k; m.scale.y=Math.max(0.001,u.ts); }
}
const labelsEl=document.getElementById('labels'); let labelsOn=true, labelsDirty=true; const labelMap=new Map(); const _lv=new THREE.Vector3();
const MAJOR=new Set(['colosseum','forumRomanum','circusMax','pantheon','palatium','trajanForum','capitolium','trajanBaths','marcellus','mausAug']);
function shortName(n){ return n.split(' – ')[0].split(' (')[0].split(' · ')[0]; }
function syncLabels(){
  labelsDirty=false; const keep=new Set();
  for(const b of buildings.values()){ if(!b.lm||!INFO[b.lm]) continue; keep.add(b.id);
    if(!labelMap.has(b.id)){ const el=document.createElement('button'); el.className='lbl'; el.textContent=shortName(INFO[b.lm].name||DEFS[b.type].name); const lm=b.lm, id=b.id;
      if(MAJOR.has(lm)) el.dataset.major='1';
      el.onclick=()=>{ showInfo(lm); const bb=buildings.get(id); if(bb) pulses.push({m:bb.mesh,t:0,base:bb.mesh.scale.y}); sfx('tick'); }; labelsEl.appendChild(el); labelMap.set(b.id,el); } }
  for(const [id,el] of labelMap) if(!keep.has(id)){ el.remove(); labelMap.delete(id); }
}
function updateLabels(){
  if(labelsDirty) syncLabels();
  labelsEl.style.display=labelsOn?'':'none'; if(!labelsOn) return;
  const W=innerWidth,H=innerHeight, far=camera.position.distanceTo(controls.target);
  labelsEl.classList.toggle('small',far>N*0.75);
  for(const [id,el] of labelMap){ const b=buildings.get(id); if(!b) continue; const bb=b.mesh.geometry.boundingBox; const h=(bb?bb.max.y:1)*b.mesh.scale.y+0.3;
    _lv.set(b.mesh.position.x,h,b.mesh.position.z).project(camera);
    if(_lv.z>1||_lv.x<-1.05||_lv.x>1.05||_lv.y<-1.05||_lv.y>1.05||!b.mesh.visible||(far>N*0.5&&!el.dataset.major)){ el.style.display='none'; continue; }
    el.style.display=''; el.style.transform=`translate(${((_lv.x+1)/2*W).toFixed(1)}px,${((1-_lv.y)/2*H).toFixed(1)}px) translate(-50%,-100%)`; }
}
/* =========================================================
   Pętla
   ========================================================= */
const statsEl=document.getElementById('stats'); let statT=0, saveT=0;
function updateStats(){ let pop=0; for(const b of buildings.values()) pop+=DEFS[b.type].pop||0;
  const walking=agents.filter(a=>a.kind==='ped').length+patrols.length*7;
  statsEl.textContent=`👥 ${pop.toLocaleString('pl-PL')} mieszkańców · 🚶 ${walking} na ulicach`; }
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=clamp((now-last)/1000,0,0.05); last=now;
  if(dirtyLines.size) processLines();
  if(dirtyTerrain){ rebuildTerrain(); dirtyTerrain=false; }
  camStep(dt); controls.update();
  for(let k=growing.length-1;k>=0;k--){ const g=growing[k]; g.t+=dt/0.42; const t=Math.min(1,g.t); const sy=easeOutBack(t), sxz=0.75+0.25*Math.min(1,t*1.4);
    g.m.scale.set(sxz,Math.max(0.01,sy),sxz); if(t>=1){ g.m.scale.set(1,1,1); growing.splice(k,1); } }
  for(let k=pulses.length-1;k>=0;k--){ const p=pulses[k]; if(p.base==null) p.base=p.m.scale.y; p.t+=dt/0.35; const s=1+0.07*Math.sin(Math.min(1,p.t)*Math.PI); p.m.scale.set(s,p.base*s,s); if(p.t>=1){ p.m.scale.set(1,p.base,1); pulses.splice(k,1); } }
  updateAgents(dt,now/1000);
  todayStep(dt); updateLabels();
  T.water.material.emissive.setRGB(0.02+Math.sin(now/900)*0.015,0.05+Math.sin(now/900)*0.02,0.07);
  statT+=dt; if(statT>0.6){ statT=0; updateStats(); }
  saveT+=dt; if(saveT>2.5){ saveT=0; autosave(); }
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderItems(); });

/* ---- start ---- */
function start(){
  try{ infoAuto=localStorage.getItem('urbs-info')!=='0'; }catch(e){}
  buildBoard(); resetCamera(); applyTime();
  let loaded=false;
  try{ const s=localStorage.getItem('urbs-save-v2'); if(s){ deserialize(s); loaded=true; } }catch(e){ console.warn(e); }
  if(!loaded){ romeTrajan(); dirtySave=true; }
  undoStack.length=0; dirtySave=false;
  renderIcons();
  renderCats(); selectTool('camera');
  applyControlMode();
  window.__urbsReady=true;
  document.getElementById('loading').remove();
  requestAnimationFrame(loop);
  if(!loaded) setTimeout(()=>showInfo('rome'),700);
}
start();
if('serviceWorker' in navigator&&location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
